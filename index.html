<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>火焰兰 PersonalOS</title>
<meta name="theme-color" content="#f1bfbc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="火焰兰">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  --aqua:#c4f3f0; --grass:#dcf7d8; --coral:#f1bfbc; --bg:#f4deda;
  --ink:#222222; --sub:#777777; --card:#ffffff; --line:#f4deda;
  --shadow:0 2px 12px rgba(241,191,188,0.12);
  --r-card:18px; --r-btn:14px; --r-input:12px;
  --outline:rgba(150,95,88,.5);
  --hard:color-mix(in srgb, var(--coral) 55%, #ffffff);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"SF Pro","SF Pro Text",system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
@media(min-width:900px){#app{max-width:680px}}
#pages{padding:16px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;transition:opacity .15s}
button:active{opacity:.6}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r-input);padding:10px 12px;width:100%;min-width:0;max-width:100%;background:var(--card);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--coral)}
textarea{resize:none;min-height:72px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card-title{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.h1{font-size:22px;font-weight:700;letter-spacing:.3px}
/* 返回按钮：在可点击进入的页面顶部吸顶 */
.back-bar{position:sticky;top:0;z-index:58;display:flex;width:max-content;align-items:center;gap:3px;margin:0 0 10px;padding:6px 13px 6px 9px;border:2.5px solid var(--outline);border-radius:999px;background:var(--card);box-shadow:3px 3px 0 var(--hard);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.back-bar .bk{font-size:23px;line-height:1;margin-top:-3px;font-weight:700}
/* 头像 / 应用图标 */
.avatar{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--outline);box-shadow:3px 3px 0 var(--hard);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;cursor:pointer;flex:none}
.avatar.sm{width:46px;height:46px;font-size:24px}
.avatar img{width:100%;height:100%;object-fit:cover}
.app-logo{width:60px;height:60px;border-radius:16px;border:2.5px solid var(--outline);box-shadow:3px 3px 0 var(--hard);background:linear-gradient(135deg,#f1bfbc,#c4f3f0);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex:none}
.app-logo img{width:100%;height:100%;object-fit:cover}
/* emoji 选择器 */
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-cell{font-size:22px;padding:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;line-height:1}
.emoji-cell:active{background:var(--aqua)}
.emoji-cell.on{border-color:var(--coral);background:var(--aqua)}
.qe-ic{cursor:pointer;margin-right:3px;display:inline-block}

.sub{color:var(--sub);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:60}
@media(min-width:900px){.tabbar{max-width:680px}}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:10.5px;color:var(--sub)}
.tab-item .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.55;transition:all .15s}
.tab-item.on{color:var(--ink);font-weight:600}
.tab-item.on .ic{filter:none;opacity:1}
/* 悬浮按钮 */
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:999px;background:var(--coral);color:#fff;font-size:28px;font-weight:300;box-shadow:0 6px 18px rgba(241,191,188,.55);z-index:70;display:flex;align-items:center;justify-content:center;transition:transform .25s;touch-action:none;cursor:grab}
.fab:active{cursor:grabbing}
.fab.open{transform:rotate(45deg)}
.fab-mask{position:fixed;inset:0;background:rgba(34,34,34,.18);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:65}
.fab-mask.show{opacity:1;pointer-events:auto}
.fab-menu{position:fixed;right:18px;bottom:calc(148px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;gap:9px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s}
.fab-menu.show{opacity:1;pointer-events:auto;transform:none}
.fab-menu button{background:var(--card);border-radius:var(--r-btn);padding:10px 16px;font-size:14px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab-menu.center{display:flex;flex-direction:row;gap:20px;align-items:flex-start}
.fab-menu.center .fab-col{display:flex;flex-direction:column;gap:9px}
.fab-menu.center .fab-col-l{align-items:flex-start}
.fab-menu.center .fab-col-r{align-items:flex-end}
/* 按钮 */
.btn{border-radius:var(--r-btn);padding:11px 18px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-coral{background:var(--coral);color:#fff}
.btn-grass{background:var(--grass);color:#3a5c36}
.btn-aqua{background:var(--aqua);color:#1f5b57}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
/* 标签chip */
.chip{display:inline-flex;align-items:center;background:var(--grass);color:#3a5c36;font-size:11px;font-weight:600;border-radius:8px;padding:2px 8px}
.chip.aqua{background:var(--aqua);color:#1f5b57}
.chip.coral{background:var(--coral);color:#fff}
/* 进度条 */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--aqua);border-radius:99px;transition:width .3s}
/* 筛选段控 */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:10px;padding:7px 0;font-size:13px;color:var(--sub);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.05)}
/* 任务条目 */
.task{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;touch-action:pan-y}
.task:last-child{border-bottom:none}
.task-inner{display:flex;align-items:center;gap:12px;flex:1;transition:transform .25s;background:inherit}
.ckbox{width:23px;height:23px;min-width:23px;border-radius:8px;border:1.8px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:all .15s}
.ckbox.done{background:var(--aqua);border-color:var(--aqua);color:#fff}
.task.done .t-title{color:#aaa;text-decoration:line-through}
.t-title{font-size:15px;font-weight:500}
.t-meta{font-size:11.5px;color:var(--sub);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swipe-acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch;transform:translateX(100%);transition:transform .25s}
.task.swiped .task-inner{transform:translateX(calc(var(--sw) * -1))}
.task.swiped .swipe-acts{transform:none}
.swipe-acts button{width:56px;font-size:12px;color:#fff;font-weight:600}
.sa-edit{background:#d8c9a8}.sa-del{background:var(--coral)}.sa-stop{background:#b9b9b9}
/* 账单条目 */
.bill{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:none}
.bill-ic{width:34px;height:34px;min-width:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--line)}
.ov-acts{display:flex;gap:6px;flex-shrink:0}
.ov-acts .btn-sm{padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.g-sel{width:18px;height:18px;min-width:18px;accent-color:#f1bfbc;margin:0;align-self:flex-start;margin-top:10px}
.g-sum{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--line);border-radius:12px;font-size:13px}
.g-sum b{font-weight:700}
.g-sum .sub{margin-left:auto;color:var(--sub)}
.g-sum .btn-sm{color:#e0908b}
.amt-in{color:#3aa79f;font-weight:700}
.amt-out{color:#e0908b;font-weight:700}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(34,34,34,.3);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.modal-mask.show{opacity:1}
.modal{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(40px);transition:transform .25s}
.modal-mask.show .modal{transform:none}
@media(min-width:900px){.modal-mask{align-items:center}.modal{border-radius:24px;max-width:480px}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal h3 .x{font-size:20px;color:var(--sub);font-weight:400;padding:0 4px}
.f-label{font-size:12.5px;color:var(--sub);font-weight:600;margin:13px 0 6px}
.cat-wrap{display:flex;flex-wrap:wrap;gap:8px}
.cat-item{padding:7px 14px;border-radius:10px;background:var(--line);font-size:13px;font-weight:500;color:var(--sub)}
.cat-item.on{background:var(--coral);color:#fff;font-weight:600}
.cat-add{background:var(--grass);color:#3a5c36;font-weight:600}
/* 图表 */
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:26px;background:var(--aqua);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .3s}
.bar-lb{font-size:10px;color:var(--sub)}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hbar-name{width:76px;font-size:12.5px;color:var(--sub);text-align:right}
.hbar-track{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;min-width:2px;transition:width .3s}
.hbar-val{width:74px;font-size:12px;font-weight:600}
/* 速记 */
.note-item{padding:12px 2px;border-bottom:1px solid var(--line)}
.note-item:last-child{border-bottom:none}
.note-txt{font-size:14px;white-space:pre-wrap;word-break:break-word}
/* AI对话 */
.chat-box{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--coral);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.qcmd{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qcmd button{background:var(--grass);color:#3a5c36;font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px}
/* toast */
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(8px);background:rgba(34,34,34,.85);color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
/* 设置行 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.set-row:last-child{border-bottom:none}
.switch{width:46px;height:27px;border-radius:99px;background:#e7e0de;position:relative;transition:background .2s}
.theme-grid{display:flex;flex-wrap:wrap;gap:14px 12px}
.theme-item{display:flex;flex-direction:column;align-items:center;gap:7px;width:56px;cursor:pointer}
.theme-dot{width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.10);border:2.5px solid transparent;transition:transform .15s;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.theme-dot span{display:block;width:100%;height:100%}
.theme-item:active .theme-dot{transform:scale(.92)}
.theme-item.on .theme-dot{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.theme-name{font-size:11px;color:var(--sub);text-align:center;line-height:1.25}
.theme-item.on .theme-name{color:var(--ink);font-weight:700}
.switch i{position:absolute;top:2.5px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:left .2s}
.switch.on{background:var(--aqua)}
.switch.on i{left:21px}
.img-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.empty{text-align:center;color:#bbb;font-size:13px;padding:26px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acct-col{display:flex;flex-direction:column;gap:10px}
.acct-group-title{font-size:12px;font-weight:600;color:var(--sub);margin:2px 2px 8px}
.acct-box{border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.acct-box .a-left{display:flex;flex-direction:column;gap:3px;min-width:0}
.acct-box .a-right{max-width:60%;text-align:right}
.acct-box .a-name{font-size:13px;color:var(--sub);margin-bottom:0}
.acct-box .a-val{font-size:17px;font-weight:700;letter-spacing:.2px;text-align:right;word-break:break-all}
.acct-box .a-month{font-size:10.5px;color:var(--sub);margin-top:3px;text-align:right}
.acct-box .a-tip{font-size:10px;color:var(--sub)}
.acct-box{cursor:pointer;-webkit-tap-highlight-color:transparent;justify-content:flex-start}
.acct-box .a-right{margin-left:auto}
.acct-go{margin-left:10px;color:var(--sub);font-size:22px;font-weight:700;flex:none;line-height:1;transition:transform .15s}
.acct-box:active .acct-go{transform:translateX(3px)}
.page-anim{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 进入动画 */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .55s ease;opacity:1}
#splash.hide{opacity:0;pointer-events:none}
.splash-inner{text-align:center;padding:30px;animation:fadein .5s ease}
.splash-ic{font-size:48px;animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.splash-date{font-size:15px;color:var(--sub);margin-top:22px;letter-spacing:1.5px}
.splash-time{font-size:44px;font-weight:800;color:var(--ink);margin-top:6px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.splash-msg{font-size:15px;color:#c98d88;margin-top:20px;font-weight:600;line-height:1.6}
/* ================= 排班日历 ================= */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.cal-head .m{font-size:16px;font-weight:700}
.cal-head .nav{display:flex;gap:8px}
.cal-head .nav button{width:32px;height:32px;border-radius:50%;border:none;background:var(--card);font-size:16px;color:var(--coral);box-shadow:var(--shadow);cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.cal-cell{border-radius:12px;background:#fff;min-height:54px;padding:6px 4px;cursor:pointer;border:1px solid transparent;transition:opacity .15s}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:#f1bfbc}
.cal-cell.sel{border-color:#7fc9c3;background:#effaf9}
.cal-mini .cal-head{margin:0 2px 8px}
.cal-mini .cal-head .m{font-size:14px}
.cal-mini .cal-head .nav button{width:26px;height:26px;font-size:14px}
.cal-mini .cal-grid{gap:3px}
.cal-mini .cal-wd{font-size:10px;padding:1px 0}
.cal-mini .cal-cell{min-height:34px;padding:3px 2px;border-radius:9px}
.cal-mini .cal-cell .d{font-size:11px;text-align:center}
.cal-cell .d{font-size:12.5px;font-weight:600;color:#444;line-height:1}
.cal-cell .tags{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.cal-cell .sd{height:7px;border-radius:4px;font-size:0;overflow:hidden}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px}
.cal-legend .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.cal-legend .dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.shift-list .task{margin-bottom:8px}
.shift-bar{height:6px;border-radius:4px;margin-top:6px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.chip-st{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:#555}
.chip-st.on{font-weight:700;color:#222}
.img-prev{max-width:100%;border-radius:12px;margin:8px 0;display:block}
/* ============ 横屏 / 宽屏：左侧索引栏 ============ */
@media (orientation:landscape){
  #app{display:flex;max-width:none;margin:0;height:100vh;overflow:hidden}
  .tabbar{position:static;order:-1;left:auto;right:auto;top:auto;bottom:auto;transform:none;width:96px;max-width:none;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--line);border-radius:0;padding:18px 0;background:var(--card)}
  .tab-item{justify-content:center;gap:5px;padding:16px 4px;font-size:9.5px}
  .tab-item .ic{font-size:23px}
  #pages{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:22px 26px;max-width:1180px;margin:0 auto}
  .fab{bottom:20px;right:20px}
  .fab-menu{bottom:90px;right:20px}
}
/* ===== 贴纸手账风（选定视觉） ===== */
.card{border:2.5px solid var(--outline);border-radius:20px;box-shadow:4px 4px 0 var(--hard)}
.btn{border:2.5px solid var(--outline);box-shadow:3px 3px 0 var(--hard)}
.btn-ghost{border:2.5px solid var(--outline)}
input,select,textarea{border:2.5px solid var(--outline);box-shadow:3px 3px 0 var(--hard)}
.chip{border:2px solid var(--outline)}
.chip-st{border:2px solid var(--outline)}
.seg{border:2px solid var(--outline)}
.ckbox{border:2px solid var(--outline)}
.g-sum{border:2px solid var(--outline);box-shadow:3px 3px 0 var(--hard)}
.cat-item{border:2px solid var(--outline)}
.qcmd button{border:2px solid var(--outline)}
.cal-head .nav button{border:2px solid var(--outline);box-shadow:2px 2px 0 var(--hard)}
.cal-cell{border:1.5px solid var(--outline)}
.tabbar{border-top:2.5px solid var(--outline);box-shadow:0 -4px 0 var(--hard)}
.fab{border:3px solid var(--outline);border-radius:50% 50% 50% 16px;box-shadow:4px 4px 0 var(--hard)}

.acct-box:nth-child(2){transform:rotate(.5deg)}

.float-win.show{display:flex}

}

.bi-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.amt-in{color:#3aa79f}

.ov-search:focus{border-color:var(--coral)}
</style>

<body>
<div id="app">
  <main id="pages"></main>
  <div id="fabMask" class="fab-mask" onclick="toggleFab(false)"></div>
  <div id="fabMenu" class="fab-menu"></div>
  <button id="fab" class="fab" title="拖动可移动 · 点击展开">＋</button>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="dogDeco"><span class="dd d-paw">🐾</span><span class="dd d-bone">🦴</span><span class="dd d-pup">🐶</span></div>
  <div id="floatWin" class="float-win">
    <div class="fw-head" id="fwHead"><span>📌</span><span class="fw-title">悬浮速记</span><button class="fw-x" onclick="toggleFloatWin(false)" title="收起">×</button></div>
    <div class="fw-body"><textarea id="fwText" placeholder="随手记点什么…拖动顶部标题栏可移动位置" oninput="saveFloatNote()"></textarea><div class="fw-tip">拖动标题栏移动 · 内容自动保存</div></div>
  </div>
</div>
<div id="splash">

    <div class="splash-date" id="splashDate"></div>

    <div class="splash-msg" id="splashMsg"></div>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="onAvatarPicked(this)">
<div id="toast" class="toast"></div>
<script>
/* ================= 数据层（本地存储，隐私优先） ================= */
const KEY='huoyanlan_personalos_v1';
const DEF={
  profile:{nickname:'',birthday:'',saveGoal:'',budgetDaily:'',budgetMood:'',motto:'',avatar:''},
  settings:{remindSave:true,remindGift:true,remindTask:true,appIcon:''},
  quickIcons:{study:'✅',money:'💰',shift:'📅'},
  todayMotto:{date:'',text:''},
  incomes:[],expenses:[],gifts:[],
  tasks:[],taskDone:{},taskSkip:{},taskImgs:{},
  notes:[],schedule:[],
  shifts:[],
  incomeCats:['工资','兼职','理财','红包','其他'],
  expenseCats:['餐饮','交通','购物','居家','医疗','其他'],
  moodCats:['娱乐','美妆','奶茶咖啡','游戏','宠爱自己','其他'],
  chat:[]
};
/* 排班班次类型（沿用四色规范 + 中性灰，保持低视觉干扰） */
const SHIFT_TYPES=[
  {key:'早班',color:'#c4f3f0'},
  {key:'午班',color:'#dcf7d8'},
  {key:'晚班',color:'#f1bfbc'},
  {key:'夜班',color:'#cdb4e0'},
  {key:'休息',color:'#ececec'},
  {key:'培训',color:'#bfe0ef'},
  {key:'会议',color:'#f4deda'},
  {key:'值班',color:'#f7d9a8'}
];
const shiftColor=t=>{const f=SHIFT_TYPES.find(x=>x.key===t);return f?f.color:'#e6e6e6';};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);const s=Object.assign(JSON.parse(JSON.stringify(DEF)),d);(s.shifts||[]).forEach(sh=>{if(sh.sdate===undefined){sh.sdate=sh.date||'';sh.stime=sh.start||'';sh.edate=sh.date||sh.sdate;sh.etime=sh.end||'';}});return s;}}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){S._ts=S._ts||Date.now();localStorage.setItem(KEY,JSON.stringify(S));scheduleSync();}
function commit(){save();render();}

/* ================= 主题配色（5 套） ================= */
const THEMES=[
  {name:'默认',     c:['#c4f3f0','#dcf7d8','#f1bfbc','#f4deda'], card:'#ffffff'},
  {name:'青提芭乐', c:['#FEDOD6','#E4F6A9','#FF82A2','#BDDE93'], card:'#fff7f4'},
  {name:'海盐葡萄', c:['#B6A9C8','#EFE4D4','#9078AC','#302B58'], card:'#fbf6f1', bg:'#EFE4D4', accent:'#302B58'},
  {name:'薄荷曼波', c:['#CFE4DD','#F9F4EA','#FCD3D5','#8D6C63'], card:'#fcfbf7'},
  {name:'淡淡顺顺', c:['#F5C7C9','#EFE4D4','#F8819B','#B9D9EA'], card:'#fdf7f8'},
];
const EMOJIS=['🌸','✅','💰','📅','📚','📝','🎯','⭐','🔥','💡','🏠','🐶','📌','🍀','🌟','💎','📊','🧾','🎁','⏰','🚀','☕','🎨','🌈','💖','🐱','🌻','🍰','🎀','🪴'];
const THEME_KEY='huoyanlan_theme';
function curTheme(){const i=parseInt(localStorage.getItem(THEME_KEY),10);return (i>=0&&i<THEMES.length)?i:0;}
function applyTheme(i){
  const t=THEMES[i]||THEMES[0];const r=document.documentElement.style;
  r.setProperty('--aqua',t.c[0]);r.setProperty('--grass',t.c[1]);
  r.setProperty('--coral', t.accent||t.c[2]);
  r.setProperty('--bg', t.bg||t.c[3]);r.setProperty('--line', t.bg||t.c[3]);
  r.setProperty('--card', t.card||'#ffffff');
}
function setTheme(i){
  localStorage.setItem(THEME_KEY,String(i));applyTheme(i);render();
  toast('已切换为「'+THEMES[i].name+'」主题');
}

/* ================= 云同步（GitHub 私有仓库 · 你的云盘） ================= */
const GH_API='https://api.github.com';
const GH_TOKEN_KEY='huoyanlan_gh_token';
const GH_REPO_KEY='huoyanlan_gh_repo';
const GH_PATH_KEY='huoyanlan_gh_path';
const GH_BRANCH_KEY='huoyanlan_gh_branch';
const CLOUD_ON_KEY='huoyanlan_cloud_on';
let cloudState={on:false,status:'off',last:0,msg:''};
let _syncTimer=null;

function ghCfg(){
  return {
    token:localStorage.getItem(GH_TOKEN_KEY)||'',
    repo:localStorage.getItem(GH_REPO_KEY)||'',
    path:localStorage.getItem(GH_PATH_KEY)||'personalos.json',
    branch:localStorage.getItem(GH_BRANCH_KEY)||'main'
  };
}
function ghConnected(){const c=ghCfg();return cloudState.on&&!!c.token&&!!c.repo;}
function ghRepoParts(){
  const c=ghCfg();const i=c.repo.indexOf('/');
  return {owner:c.repo.slice(0,i),name:c.repo.slice(i+1),path:c.path,branch:c.branch};
}
function ghFileUrl(){
  const p=ghRepoParts();
  return `${GH_API}/repos/${encodeURIComponent(p.owner)}/${encodeURIComponent(p.name)}/contents/${encodeURIComponent(p.path)}?ref=${encodeURIComponent(p.branch)}`;
}
function ghFilePutUrl(){
  const p=ghRepoParts();
  return `${GH_API}/repos/${encodeURIComponent(p.owner)}/${encodeURIComponent(p.name)}/contents/${encodeURIComponent(p.path)}`;
}
function ghHeaders(){
  const c=ghCfg();
  return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
}
function ghB64encode(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\n/g,'');
}
function ghB64decode(b64){
  const bin=atob(b64.replace(/\s/g,''));const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function cloudHasContent(){
  const s=S;
  return (s.incomes&&s.incomes.length)||(s.expenses&&s.expenses.length)||(s.gifts&&s.gifts.length)||
         (s.tasks&&s.tasks.length)||(s.shifts&&s.shifts.length)||(s.notes&&s.notes.length)||
         (s.insights&&s.insights.length)||(s.chat&&s.chat.length)||
         (s.profile&&(s.profile.nickname||s.profile.motto||s.profile.saveGoal));
}
function scheduleSync(){
  if(!cloudState.on)return;
  if(_syncTimer)clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{cloudPush();},700);
}
async function ghGet(){
  const res=await fetch(ghFileUrl(),{headers:ghHeaders()});
  if(res.status===404)return {ok:true,sha:null,data:null};
  if(res.status===401)return {ok:false,err:'令牌无效或无权限（401）'};
  if(res.status===403)return {ok:false,err:'禁止访问（403，权限不足或额度用尽）'};
  if(!res.ok)return {ok:false,err:'HTTP '+res.status};
  const j=await res.json();
  try{const data=JSON.parse(ghB64decode(j.content));return {ok:true,sha:j.sha,data};}
  catch(e){return {ok:false,err:'云端数据解析失败'};}
}
async function ghPut(content,sha){
  const body={message:'PersonalOS 自动同步 '+new Date().toLocaleString('zh-CN'),content:content,branch:ghCfg().branch};
  if(sha)body.sha=sha;
  let res=await fetch(ghFilePutUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(res.status===409&&sha){
    const g=await ghGet();
    if(g.ok&&g.sha){body.sha=g.sha;res=await fetch(ghFilePutUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});}
  }
  return res;
}
async function cloudPush(){
  if(!ghConnected())return;
  S._ts=Date.now();
  const payload=JSON.parse(JSON.stringify(S));
  const raw=JSON.stringify(payload);
  if(raw.length>900000){cloudSetStatus('error','数据过大（含图片可能超 1MB），请先「清除缓存图片」');return;}
  cloudSetStatus('syncing');
  try{
    const g=await ghGet();
    if(!g.ok){cloudSetStatus('error',g.err);return;}
    if(g.data&&(g.data._ts||0)>(payload._ts||0)){cloudSetStatus('ok','云端已有更新，已保留');cloudPull();return;}
    const res=await ghPut(ghB64encode(raw),g.sha);
    if(res.ok){cloudState.last=Date.now();cloudSetStatus('ok','已同步 · '+fmtClock(cloudState.last));}
    else if(res.status===401){cloudSetStatus('error','令牌无效（401）');}
    else if(res.status===403){cloudSetStatus('error','禁止访问（403）');}
    else if(res.status===404){cloudSetStatus('error','仓库或文件路径不存在（404）');}
    else{cloudSetStatus('error','上传失败 '+res.status);}
  }catch(e){cloudSetStatus('error','网络异常');}
}
async function cloudPull(){
  if(!ghConnected()){cloudSetStatus('off','未连接');return false;}
  cloudSetStatus('syncing');
  try{
    const g=await ghGet();
    if(!g.ok){cloudSetStatus('error',g.err);return false;}
    if(!g.data){cloudSetStatus('ok','云端暂无数据');return false;}
    const ct=g.data._ts||0;
    if(!S._ts||ct>S._ts){
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),g.data);S._ts=ct;save();
      cloudState.last=Date.now();cloudSetStatus('ok','已从云端恢复 · '+fmtClock(cloudState.last));
      if(cur==='me')refreshCloudCard();else render();
      return true;
    }
    cloudSetStatus('ok','本地已是最新');
    return true;
  }catch(e){cloudSetStatus('error','网络异常');return false;}
}
function fmtClock(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function cloudSetStatus(st,msg){cloudState.status=st;if(msg!==undefined)cloudState.msg=msg;refreshCloudCard();}
function refreshCloudCard(){
  const txt=$('#cloudStatusTxt'),body=$('#cloudBody');
  if(!txt||!body)return;
  const map={off:['未连接','#bbbbbb'],ok:['已同步','#3aa79f'],syncing:['同步中…','#e0a23a'],error:['异常','#e0908b']};
  const m=map[cloudState.status]||map.off;
  txt.textContent=m[0];txt.style.color=m[1];
  if(!cloudState.on){
    const c=ghCfg();
    body.innerHTML=`<div class="sub" style="margin-bottom:10px">把数据存到你自己的 GitHub 私有仓库，永久保存、完全由你掌控，浏览器内自动同步。需要你生成一个有 <b>repo</b> 权限的 Personal Access Token。<b style="color:#3aa79f">连接成功即把本机现有数据一键上传到该仓库。</b></div>
      <div class="f-label">GitHub Token（仅存本机，只发往 GitHub）</div>
      <input id="ghToken" type="password" placeholder="ghp_xxx…" value="${esc(c.token)}">
      <div class="f-label mt8">仓库（owner/name）</div>
      <input id="ghRepo" placeholder="yourname/PersonalOS" value="${esc(c.repo)}">
      <div class="row mt8">
        <div style="flex:1"><div class="f-label">文件路径</div><input id="ghPath" placeholder="personalos.json" value="${esc(c.path)}"></div>
        <div style="flex:1;margin-left:8px"><div class="f-label">分支</div><input id="ghBranch" placeholder="main" value="${esc(c.branch)}"></div>
      </div>
      <button class="btn btn-aqua btn-block mt12" onclick="cloudConnect()">连接并上传本机数据</button>
      <div class="sub mt8" style="font-size:11px;line-height:1.5">① GitHub → Settings → Developer settings → Personal access tokens → 生成（勾选 repo 范围）。② 新仓库请先在 GitHub 建好一个空的私有仓库。</div>`;
  }else{
    const c=ghCfg();
    const last=cloudState.last?('上次 '+fmtClock(cloudState.last)):'';
    body.innerHTML=`<div class="sub" style="margin-bottom:8px">${esc(cloudState.msg||'')}</div>
      <div class="set-row" style="cursor:default"><span>📦 仓库</span><span class="sub" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.repo)}/${esc(c.path)}</span></div>
      <div class="grid2 mt12">
        <button class="btn btn-coral btn-sm" onclick="cloudPushNow()">📤 推送本机数据</button>
        <button class="btn btn-aqua btn-sm" onclick="cloudPullNow()">⬇️ 从云端恢复</button>
      </div>
      <div class="row mt12">
        <button class="btn btn-ghost btn-sm" onclick="cloudDisconnect()">断开连接</button>
        <span class="sub" style="margin-left:auto">${last}</span>
      </div>
      <div class="sub mt8" style="font-size:11px;line-height:1.5">✅ 数据存于你自己的私有仓库、加密传输、永久保存。Token 仅保存在本机浏览器。文件含大量图片可能超过 1MB 限制，建议适时「清除缓存图片」。</div>`;
  }
}
async function initCloud(){
  cloudState.on=localStorage.getItem(CLOUD_ON_KEY)==='1';
  if(cloudState.on && !ghCfg().token){ // 旧 jsonblob 迁移：有开启标记但无 GitHub 配置 → 视为未连接，避免进入空配置“已连接”态
    cloudState.on=false;localStorage.setItem(CLOUD_ON_KEY,'0');
  }
  if(!cloudState.on){cloudSetStatus('off','未连接');return;}
  await cloudPull();
  if(cloudHasContent()){cloudPush();}
}
function cloudConnect(){
  const token=$('#ghToken'),repo=$('#ghRepo'),path=$('#ghPath'),branch=$('#ghBranch');
  const t=token?token.value.trim():'',r=repo?repo.value.trim():'',p=path?path.value.trim():'',b=branch?branch.value.trim():'';
  if(!t){toast('请填写 GitHub Token');return;}
  if(!r||!r.includes('/')){toast('仓库格式应为 owner/name');return;}
  if(!p)p='personalos.json';
  if(!b)b='main';
  localStorage.setItem(GH_TOKEN_KEY,t);
  localStorage.setItem(GH_REPO_KEY,r);
  localStorage.setItem(GH_PATH_KEY,p);
  localStorage.setItem(GH_BRANCH_KEY,b);
  localStorage.setItem(CLOUD_ON_KEY,'1');
  cloudState.on=true;
  toast('正在连接并测试…');
  (async()=>{
    await cloudPull();
    if(cloudState.status==='error'){
      cloudState.on=false;localStorage.setItem(CLOUD_ON_KEY,'0');
      return;
    }
    if(cloudHasContent()){
      const wasEmpty=!cloudState.last;
      await cloudPush();
      toast(wasEmpty?'已把本机现有数据上传到仓库':'已连接，本机数据已同步到仓库');
    }else{
      toast('已连接仓库（本机暂无数据）');
    }
  })();
}
function cloudDisconnect(){
  localStorage.setItem(CLOUD_ON_KEY,'0');
  cloudState.on=false;cloudState.status='off';cloudState.msg='';
  toast('已断开云同步（本机数据保留）');refreshCloudCard();
}
function cloudPushNow(){cloudPush();toast('正在上传');}
function cloudPullNow(){cloudPull();toast('正在恢复');}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n)||0;return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const WEEK=['日','一','二','三','四','五','六'];
function dateOffset(base,off){const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}

/* ================= 账户余额计算（自动联动） ================= */
function balances(){
  const b={save:0,daily:0,mood:0};
  S.incomes.forEach(i=>{b.save+=Number(i.alloc.save)||0;b.daily+=Number(i.alloc.daily)||0;b.mood+=Number(i.alloc.mood)||0;});
  S.expenses.forEach(e=>{b[e.account]-=Number(e.amount)||0;});
  S.gifts.forEach(g=>{const a=Number(g.amount)||0;b.save+= g.type==='out'?-a:a;});
  return b;
}
function monthBalances(){
  const m=today().slice(0,7);
  const b={save:0,daily:0,mood:0};
  S.incomes.forEach(i=>{if((i.date||'').slice(0,7)!==m)return;b.save+=Number(i.alloc.save)||0;b.daily+=Number(i.alloc.daily)||0;b.mood+=Number(i.alloc.mood)||0;});
  S.expenses.forEach(e=>{if((e.date||'').slice(0,7)!==m)return;b[e.account]-=Number(e.amount)||0;});
  S.gifts.forEach(g=>{if((g.date||'').slice(0,7)!==m)return;const a=Number(g.amount)||0;b.save+=g.type==='out'?-a:a;});
  return b;
}
function todayFlow(){
  const t=today();let inc=0,exp=0,moodExp=0,dailyExp=0;
  S.incomes.forEach(i=>{if(i.date===t)inc+=Number(i.total)||0;});
  S.expenses.forEach(e=>{if(e.date===t){exp+=Number(e.amount)||0;if(e.account==='mood')moodExp+=Number(e.amount)||0;else dailyExp+=Number(e.amount)||0;}});
  return{inc,exp,moodExp,dailyExp};
}
function giftStat(range){
  let gin=0,gout=0;const t=today(),month=t.slice(0,7);
  S.gifts.forEach(g=>{
    if(range==='today'&&g.date!==t)return;
    if(range==='month'&&(g.date||'').slice(0,7)!==month)return;
    if(g.type==='in')gin+=Number(g.amount)||0;else gout+=Number(g.amount)||0;
  });
  return{gin,gout,net:gin-gout};
}

function taskActive(t,date){
  date=date||today();
  if(t.type==='temp')return t.createdDate===date;
  if(t.endedDate&&date>=t.endedDate)return false;
  if((S.taskSkip[t.id]||[]).includes(date))return false;
  if(date<t.createdDate)return false;
  if(t.repeatType==='forever')return true;
  if(t.repeatType==='days'){const diff=(new Date(date)-new Date(t.createdDate))/86400000;return diff>=0&&diff<Number(t.repeatN||1);}
  if(t.repeatType==='weekly'){const wd=new Date(date+'T00:00:00').getDay();return (t.weekdays||[]).includes(wd);}
  return false;
}

function loadFabPos(){try{const s=JSON.parse(localStorage.getItem(FAB_KEY));if(s&&typeof s==='object')fabPos=Object.assign(fabPos,s);}catch(e){}}

function placeFab(){
  const f=$('#fab');if(!f)return;const w=f.offsetWidth||54,h=f.offsetHeight||54;
  if(fabPos.x==null||fabPos.y==null){fabPos.x=window.innerWidth-w-18;fabPos.y=window.innerHeight-h-90;}
  fabPos.x=Math.max(4,Math.min(fabPos.x,window.innerWidth-w-4));
  fabPos.y=Math.max(4,Math.min(fabPos.y,window.innerHeight-h-4));
  f.style.left=fabPos.x+'px';f.style.top=fabPos.y+'px';
  updateFabMenuAnchor();
}
function updateFabMenuAnchor(){
  const f=$('#fab'),m=$('#fabMenu');if(!f||!m)return;const w=f.offsetWidth||54,h=f.offsetHeight||54;
  const cx=f.offsetLeft+w/2,cy=f.offsetTop+h/2,midX=window.innerWidth/2,midY=window.innerHeight/2;
  const band=window.innerWidth*0.12; // 中央带状区判定
  const centerH=Math.abs(cx-midX)<=band;
  const mode=centerH?'center':(cx<midX?'left':'right');
  if(m._fabMode!==mode){m._fabMode=mode;renderFabMenuCols(mode);}
  // 重置可能残留的水平定位
  m.style.left='';m.style.right='';m.style.transform='';m.style.maxWidth='';m.style.alignItems='';
  m.classList.toggle('center',centerH);
  if(centerH){
    // 中央：两列布局，整块水平居中
    m.style.left='50%';m.style.transform='translateX(-50%)';
    m.style.maxWidth=(window.innerWidth-16)+'px';
  }else if(mode==='left'){
    // 左侧半区：向右展开、左对齐
    m.style.left=f.offsetLeft+'px';m.style.right='auto';
    m.style.alignItems='flex-start';
    m.style.maxWidth=(window.innerWidth-f.offsetLeft-8)+'px';
  }else{
    // 右侧半区：向左展开、右对齐
    m.style.right=(window.innerWidth-(f.offsetLeft+w))+'px';m.style.left='auto';
    m.style.alignItems='flex-end';
    m.style.maxWidth=(f.offsetLeft+w-8)+'px';
  }
  const topHalf=cy<midY;
  if(topHalf){
    m.style.top=(f.offsetTop+h+8)+'px';m.style.bottom='auto';
    m.style.maxHeight=(window.innerHeight-f.offsetTop-h-16)+'px';
  }else{
    m.style.bottom=(window.innerHeight-f.offsetTop+8)+'px';m.style.top='auto';
    m.style.maxHeight=(f.offsetTop-16)+'px';
  }
  m.style.overflowY='auto';
}
function initFabDrag(){
  const f=$('#fab');if(!f)return;let sx,sy,ox,oy,drag=false,moved=false;
  f.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=f.offsetLeft;oy=f.offsetTop;try{f.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  f.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;if(!moved)return;let nx=ox+dx,ny=oy+dy;nx=Math.max(4,Math.min(nx,window.innerWidth-f.offsetWidth-4));ny=Math.max(4,Math.min(ny,window.innerHeight-f.offsetHeight-4));f.style.left=nx+'px';f.style.top=ny+'px';});
  f.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(moved){fabPos.x=f.offsetLeft;fabPos.y=f.offsetTop;saveFabPos();updateFabMenuAnchor();}else{toggleFab();}});
  f.addEventListener('pointercancel',()=>{drag=false;});
}

function readImg(input,cb){
  const f=input.files&&input.files[0];if(!f){cb('');return;}
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');const max=480;
      let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}

<script>

function incomeRow(i){

      <div style="font-size:14.5px;font-weight:500">${esc(i.category)}${i.img?' 🖼':''}</div>
      <div class="sub">${esc(i.date)}${i.note?' · '+esc(i.note):''}</div>

let expQuery='';
let expMonth='';
let expSel={};
function toggleExpSel(id){
  if(expSel[id])delete expSel[id];else expSel[id]=true;
  const r=$('#expSummary');if(r)r.innerHTML=expSummaryHTML();
}
function clearExpSel(){expSel={};render();}
function filterExp(q){
  expQuery=q;q=q.trim();
  const m=expMonth;
  const inc=S.incomes.slice().sort((a,x)=>x.ts-a.ts).filter(i=>!m||(i.date||'').slice(0,7)===m);
  const exp=S.expenses.slice().sort((a,x)=>x.ts-a.ts).filter(e=>!m||(e.date||'').slice(0,7)===m);
  const fInc=!q?inc:inc.filter(i=>String(i.category).includes(q)||String(i.note||'').includes(q));
  const fExp=!q?exp:exp.filter(e=>String(e.category).includes(q)||String(e.note||'').includes(q));
  const il=$('#incomeList');if(il)il.innerHTML=fInc.length?fInc.map(incomeRow).join(''):`<div class="empty">暂无收入分配记录</div>`;
  $('#dailyList').innerHTML=fExp.filter(e=>e.account==='daily').map(billRow).join('')||`<div class="empty">暂无日常支出</div>`;
  $('#moodList').innerHTML=fExp.filter(e=>e.account==='mood').map(billRow).join('')||`<div class="empty">还没有犒劳自己的记录</div>`;
  const r=$('#expSummary');if(r)r.innerHTML=expSummaryHTML();

function filterExpMonth(v){
  expMonth=v;
  const el=$('#expMonth');if(el)el.value=v;
  filterExp(expQuery);
}
function expCurrentSet(){
  const sel=Object.keys(expSel).filter(id=>expSel[id]);
  const toInc=i=>({kind:'income',id:i.id,amt:Number(i.total)||0,account:'收入',category:i.category,date:i.date,note:i.note});
  const toExp=e=>({kind:'expense',id:e.id,amt:-(Number(e.amount)||0),account:e.account==='mood'?'心情':'日常',category:e.category,date:e.date,note:e.note});
  let set,mode;
  if(sel.length){
    const ids=new Set(sel);
    set=[...S.incomes.filter(i=>ids.has(i.id)).map(toInc),...S.expenses.filter(e=>ids.has(e.id)).map(toExp)];
    mode='已勾选';
  } else if(expQuery.trim()){
    const q=expQuery.trim();
    set=[...S.incomes.filter(i=>String(i.category).includes(q)||String(i.note||'').includes(q)).map(toInc),
         ...S.expenses.filter(e=>String(e.category).includes(q)||String(e.note||'').includes(q)).map(toExp)];
    mode='筛选「'+q+'」';
  } else {
    set=[...S.incomes.map(toInc),...S.expenses.map(toExp)];
    mode='全部账单';
  }
  if(expMonth){
    set=set.filter(x=>(x.date||'').slice(0,7)===expMonth);
    mode=(mode==='全部账单'?'全部账单':mode)+' · '+expMonth;
  }
  return {set,mode};
}
function expSummaryHTML(){
  const {set,mode}=expCurrentSet();
  let inc=0,exp=0;
  set.forEach(x=>{if(x.amt>=0)inc+=x.amt;else exp+=-x.amt;});
  const net=inc-exp;
  return `<div class="g-sum">

    ${mode==='已勾选'?`<button class="btn-sm" onclick="clearExpSel()">清空</button>`:''}
  </div>`;
}
function exportExpSet(){
  const {set,mode}=expCurrentSet();

  const rows=set.map(x=>[x.kind==='income'?'收入':'支出',x.account,x.category,x.date,(x.amt>=0?'+':'-')+fmt(Math.abs(x.amt)),x.note||'']);
  downloadExcel('PersonalOS-收支-'+(mode==='全部账单'?'全部':mode.replace(/[「」]/g,''))+'-'+today(),['类型','账户','分类','日期','金额','备注'],rows);

}

function crc32(buf){
  const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}

  return (crc^0xFFFFFFFF)>>>0;
}
function buildXlsx(files){

  files.forEach(f=>{
    const data=enc.encode(f[1]);

    const size=data.length;

    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
    dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,crc,true);dv.setUint32(18,size,true);dv.setUint32(22,size,true);
    dv.setUint16(26,nameBytes.length,true);dv.setUint16(28,0,true);lh.set(nameBytes,30);
    parts.push(lh);parts.push(data);
    const cd=new Uint8Array(46+nameBytes.length);
    const cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
    cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,size,true);cv.setUint32(24,size,true);
    cv.setUint16(28,nameBytes.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);cv.setUint32(42,offset,true);cd.set(nameBytes,46);

  });

  parts.forEach(part=>{out.set(part,p);p+=part.length;});
  const cs=p;
  central.forEach(c=>{out.set(c,p);p+=c.length;});
  const ed=new DataView(out.buffer,cs+centralSize);
  ed.setUint32(0,0x06054b50,true);ed.setUint16(4,0,true);ed.setUint16(6,0,true);

function downloadExcel(name,header,rows){

function curYM(){if(!shiftMonth){const d=new Date();shiftMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}return shiftMonth;}
function shiftsForDate(ds){return S.shifts.filter(s=>ds>=(s.sdate||'')&&ds<=(s.edate||s.sdate||'')).sort((a,b)=>String(a.stime||'').localeCompare(String(b.stime||'')));}
function daySpan(s){const a=new Date(s.sdate),b=new Date(s.edate||s.sdate);if(isNaN(a)||isNaN(b))return 1;return Math.round((b-a)/86400000)+1;}
function shiftRangeText(s){
  const sd=(s.sdate||'').slice(5).replace('-','/'),ed=(s.edate||s.sdate||'').slice(5).replace('-','/');
  if((s.edate||s.sdate)===s.sdate)return `${s.stime||'—'}${s.etime?' - '+s.etime:''}`;
  return `${sd} ${s.stime} → ${ed} ${s.etime}`;
}
function cellObj(d,out){const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return {y,m,d:day,out,ds:y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0')};}
function monthMatrix(ym){
  const [y,m]=(ym||curYM()).split('-').map(Number);
  const first=new Date(y,m-1,1),startDow=first.getDay(),daysInMonth=new Date(y,m,0).getDate(),cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push(cellObj(new Date(y,m-1,1-i),true));
  for(let d=1;d<=daysInMonth;d++)cells.push(cellObj(new Date(y,m-1,d),false));
  while(cells.length%7!==0){const lst=cells[cells.length-1];cells.push(cellObj(new Date(lst.y,lst.m-1,lst.d+1),true));}
  return cells;
}
function shiftMonthStep(n){const [y,m]=curYM().split('-').map(Number);const d=new Date(y,m-1+n,1);shiftMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();}

function importShiftParse(scope){
  const prefix=scope.slice(0,7),txt=$('#shImpText').value.trim(),img=window._shImpImg||'';
  applyShiftImport(parseShiftText(txt,prefix),prefix,img);

function parseShiftText(txt,monthPrefix){
  if(!txt)return [];
  const [y,m]=monthPrefix.split('-').map(Number);let yy=y,out=[];
  const RE_FULL=/(\d{4})\s*[年\/\-\.]\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?\s*(?:至|到|～|~)\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?/;
  const RE_SHORT=/(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?\s*(?:至|到|～|~)\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?/;
  const mkT=(h,mi)=>h?String(h).padStart(2,'0')+':'+(mi||'00'):'';
  const cleanNote=raw=>raw
    .replace(/(\d{1,2}):(\d{2})\s*[-~–至到]\s*(\d{1,2}):(\d{2})/g,'')
    .replace(/(\d{1,2}):(\d{2})/g,'')
    .replace(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/g,'')
    .replace(/(\d{1,2})[-/.月](\d{1,2})/g,'')
    .replace(/[年月日]/g,'')
    .replace(/早班|午班|晚班|夜班|休息|培训|会议|值班|班/g,'')
    .replace(/[-~–至到:]/g,' ')
    .replace(/\s+/g,' ').trim();
  const pushRange=(sy,sm,sd,st,em,ed,et,raw)=>{
    const sdate=sy+'-'+String(sm).padStart(2,'0')+'-'+String(sd).padStart(2,'0');
    const edate=sy+'-'+String(em).padStart(2,'0')+'-'+String(ed).padStart(2,'0');
    let type='早班';for(const t of SHIFT_TYPES){if(raw.includes(t.key)){type=t.key;break;}}
    const note=cleanNote(raw.replace(RE_FULL,'').replace(RE_SHORT,''));
    out.push({date:sdate,sdate,stime:st,edate,etime:et,type,note,img:''});
  };
  txt.split(/\n|；|;|\|/).forEach(line=>{
    line=line.trim();if(!line)return;
    let m=line.match(RE_FULL);
    if(m){pushRange(+m[1],+m[2],+m[3],mkT(m[4],m[5]),+m[6],+m[7],mkT(m[8],m[9]),line);return;}
    m=line.match(RE_SHORT);
    if(m){pushRange(yy,+m[1],+m[2],mkT(m[3],m[4]),+m[5],+m[6],mkT(m[7],m[8]),line);return;}
    let mm,dd=null,full=line.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
    if(full){yy=+full[1];mm=+full[2];dd=+full[3];}
    else{const p=line.match(/(\d{1,2})[-/.月](\d{1,2})/);if(p){mm=+p[1];dd=+p[2];}}
    if(!dd)return;
    const date=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    let type='早班';for(const t of SHIFT_TYPES){if(line.includes(t.key)){type=t.key;break;}}
    let start='',end='';const tm=line.match(/(\d{1,2}):?(\d{2})?\s*[-~–至到]\s*(\d{1,2}):?(\d{2})?/);
    if(tm){start=String(tm[1]).padStart(2,'0')+':'+(tm[2]||'00');end=String(tm[3]).padStart(2,'0')+':'+(tm[4]||'00');}
    else{const t2=line.match(/(\d{1,2}):(\d{2})/);if(t2)start=t2[1].padStart(2,'0')+':'+t2[2];}
    let note=cleanNote(line);
    out.push({date,type,start,end,note,img:'',sdate:date,stime:start,edate:date,etime:end});
  });
  return out;
}
function applyShiftImport(arr,monthPrefix,img){
  arr=(arr||[]).filter(x=>x&&x.sdate).map(x=>({id:uid(),sdate:String(x.sdate).slice(0,10),stime:x.stime||'',edate:String(x.edate||x.sdate).slice(0,10),etime:x.etime||'',type:SHIFT_TYPES.find(t=>t.key===x.type)?x.type:'早班',note:x.note||'',img:img||'',date:String(x.sdate).slice(0,10),start:x.stime||'',end:x.etime||''}));
  if(!arr.length){toast('没有解析到排班，换种写法试试？');return;}
  S.shifts.push(...arr);window._shImpImg='';closeModal();commit();toast('已导入 '+arr.length+' 条排班');
}

function decodeBillFile(file){
  return file.arrayBuffer().then(buf=>{
    const u8=new Uint8Array(buf);
    if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF)return new TextDecoder('utf-8').decode(buf);
    let s=new TextDecoder('utf-8',{fatal:false}).decode(buf);
    if(/�/.test(s))s=new TextDecoder('gbk',{fatal:false}).decode(buf);
    return s;
  });
}

function parseCSVLine(line){
  const out=[];let cur='';let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else{
      if(c===','){out.push(cur);cur='';}
      else if(c==='"'){q=true;}
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}
function cleanDate(s){
  s=(s||'').trim().replace(/\//g,'-');
  const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0'):'';
}
function cleanAmt(s){const n=parseFloat(String(s||'').replace(/[¥￥,\s]/g,''));return isNaN(n)?0:n;}
function guessCat(name,isIncome){
  const n=String(name||'');
  if(isIncome){
    if(/红包|奖励/.test(n))return '红包';
    if(/工资|薪酬|薪资|公积金|个税/.test(n))return '工资';
    if(/理财|基金|股票|利息|收益|分红/.test(n))return '理财';
    if(/兼职|外包|稿费|劳务/.test(n))return '兼职';
    return '其他';
  }
  const map=[['餐饮',['餐饮','星巴克','麦当劳','肯德基','吃饭','食堂','外卖','美团','饿了么','咖啡','奶茶','餐厅','饭店','小吃','烘焙','甜']],
    ['交通',['交通','滴滴','地铁','公交','加油','停车','高铁','火车','机票','打车','出租','12306','携程','滴滴出行']],
    ['购物',['购物','淘宝','天猫','京东','拼多多','超市','便利店','商城','服饰','鞋','包','网购']],
    ['居家',['居家','物业','水电','房租','家居','日用','日用百货']],
    ['医疗',['医疗','医院','诊所','体检','保险','药','健']]];
  for(const [cat,kws] of map)if(kws.some(k=>n.includes(k)))return cat;
  return '其他';
}
function parseBillText(txt,src){
  const raw=txt.split(/\r?\n/).map(l=>l.replace(/^﻿/,''));
  const lines=raw.map(l=>l.trim()).filter(Boolean);
  let hi=-1,source='未知';
  const wxH=lines.findIndex(l=>/交易时间/.test(l)&&/收\/支/.test(l));
  const aliH=lines.findIndex(l=>/(交易创建时间|交易号)/.test(l)&&/收\/支|金额/.test(l));
  if((src==='ali')||(src!=='wx'&&aliH>=0)){hi=aliH;source='支付宝';}
  else if((src==='wx')||wxH>=0){hi=wxH;source='微信支付';}
  if(hi<0)return parseBillPlain(lines);
  const cols=parseCSVLine(lines[hi]);
  const idx=re=>{for(let i=0;i<cols.length;i++)if(re.test(cols[i]))return i;return -1;};
  const timeI=idx(/交易时间|付款时间|创建时间/);
  const dirI=idx(/收\/支/);
  const amtI=idx(/金额/);
  const nameI=(()=>{let n=idx(/交易对方/);if(n<0)n=idx(/商品名称/);if(n<0)n=idx(/商品/);return n;})();
  const noteI=idx(/备注/);
  const tidI=Math.max(idx(/交易单号/),idx(/交易号/),idx(/商家订单号/));
  const items=[];let expN=0,incN=0;
  for(let i=hi+1;i<lines.length;i++){
    const ln=lines[i];
    if(/^[-=]+$/.test(ln)||/共\s*\d|记录数|笔.*交易|导出时间|申请时间|记账时间/.test(ln))continue;
    const c=parseCSVLine(ln);
    if(c.length<3)continue;
    const ds=cleanDate(timeI>=0?c[timeI]:c[0]);
    const dirRaw=dirI>=0?c[dirI]:'';
    let dir=null;
    if(/支出/.test(dirRaw))dir='expense';
    else if(/收入/.test(dirRaw))dir='income';
    else continue;
    const amt=cleanAmt(amtI>=0?c[amtI]:c[c.length-1]);
    if(!(amt>0)||!ds)continue;
    const name=(nameI>=0?c[nameI]:c[2]||'').trim()||'账单导入';
    const note=(noteI>=0?c[noteI]:'').trim();
    const extId=(tidI>=0?c[tidI]:'').trim();
    const cat=guessCat(name,dir==='income');
    items.push({dir,date:ds,amt,name,note,extId,cat});
    dir==='income'?incN++:expN++;
  }
  return {items,source,expN,incN};
}
function parseBillPlain(lines){
  const items=[];let expN=0,incN=0;
  lines.forEach(ln=>{
    const ds=cleanDate(ln);if(!ds)return;
    let dir=null;
    if(/支出|转出|付款|消费|支/.test(ln))dir='expense';
    else if(/收入|转入|收款|入账|红包|收/.test(ln))dir='income';
    const m=ln.match(/[¥￥]?\s*(\d[\d,]*\.?\d*)/);
    const amt=cleanAmt(m?m[1]:'');
    if(!dir||!(amt>0))return;
    const name=(ln.replace(/[¥￥]/g,'').replace(/\d[\d,\.]*\d?/g,'').replace(/支出|收入|转入|转出|付款|收款|消费|入账|红包|支|收/g,'').replace(/\s+/g,'')).slice(0,20)||'账单';
    items.push({dir,date:ds,amt,name,note:'',extId:'',cat:guessCat(name,dir==='income')});
    dir==='income'?incN++:expN++;
  });
  return {items,source:'文本',expN,incN};
}

  const title=$('#tkTitle').value.trim();if(!title){toast('请填写任务名称');return;}
  const type=window._tkType,repeatType=window._repType;
  const weekdays=[...document.querySelectorAll('.cat-item.wk.on')].map(b=>Number(b.dataset.w));
  if(type==='repeat'&&repeatType==='weekly'&&!weekdays.length){toast('请选择每周哪几天');return;}
  if(id){
    const t=S.tasks.find(x=>x.id===id);
    Object.assign(t,{title,type,repeatType:type==='repeat'?repeatType:null,repeatN:Number($('#repN')?$('#repN').value:7)||7,weekdays});
  }else{
    S.tasks.push({id:uid(),title,type,createdDate:window._tkDate||today(),repeatType:type==='repeat'?repeatType:null,repeatN:Number($('#repN')?$('#repN').value:7)||7,weekdays,endedDate:null});
  }
  closeModal();commit();toast(id?'已保存':'任务已创建');
}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);Object.keys(S.taskImgs).forEach(k=>{if(k.endsWith('|'+id))delete S.taskImgs[k];});commit();toast('已删除');}
function stopRepeat(id){

/* ================= AI 对话（基于本地真实数据） ================= */
function aiReply(q){
  const b=balances(),f=todayFlow(),g=giftStat('month');
  const tasks=todayTasks(),done=tasks.filter(t=>isDone(t.id)).length;
  if(/复盘/.test(q)){
    return `🤖 今日复盘（${today()}）\n✅ 任务：完成 ${done}/${tasks.length} 项${tasks.length&&done===tasks.length?'，全部达成，太棒了！':tasks.length?'，还有 '+(tasks.length-done)+' 项待完成，加油！':''}\n💰 收支：收入 +${fmt(f.inc)}，支出 -${fmt(f.exp)}（心情消费 ${fmt(f.moodExp)}）\n📝 速记：今天记录了 ${S.notes.filter(n=>n.date===today()).length} 条\n建议：睡前给未完成任务定个明日时段。`;
  }
  if(/学习计划|任务计划/.test(q)){
    const rep=S.tasks.filter(t=>t.type==='repeat'&&!t.endedDate);
    return `🤖 任务计划建议\n当前有 ${rep.length} 个循环任务在跑：\n${rep.slice(0,5).map(t=>'· '+t.title+'（'+repeatLabel(t)+'）').join('\n')||'· 暂无，建议先建立1-2个每日循环任务'}\n建议节奏：早上安排最难任务，晚上做轻量复习，每天完成后写打卡心得沉淀。`;
  }
  if(/消费分析/.test(q)){
    const month=today().slice(0,7);
    const mExp=S.expenses.filter(e=>(e.date||'').slice(0,7)===month);
    const mDaily=mExp.filter(e=>e.account==='daily').reduce((s,e)=>s+Number(e.amount),0);
    const mMood=mExp.filter(e=>e.account==='mood').reduce((s,e)=>s+Number(e.amount),0);
    const bd=Number(S.profile.budgetDaily)||0,bm=Number(S.profile.budgetMood)||0;
    return `🤖 本月消费分析\n🧾 日常支出：¥${fmt(mDaily)}${bd?`（预算 ${fmt(bd)}，${mDaily>bd?'⚠️ 已超支':'剩余 '+fmt(bd-mDaily)}）`:''}\n✨ 心情消费：¥${fmt(mMood)}${bm?`（预算 ${fmt(bm)}，${mMood>bm?'⚠️ 已超支':'剩余 '+fmt(bm-mMood)}）`:''}\n🏦 存钱账户累计：¥${fmt(b.save)}${S.profile.saveGoal?`，目标进度 ${Math.min(100,Math.round(b.save/S.profile.saveGoal*100))}%`:''}\n建议：心情消费是给生活的甜度，控制在预算内就大胆花。`;
  }
  if(/人情|台账|份子/.test(q)){
    const names={};
    S.gifts.forEach(x=>{names[x.name]=names[x.name]||{in:0,out:0};names[x.name][x.type==='in'?'in':'out']+=Number(x.amount);});
    const lines=Object.entries(names).slice(0,6).map(([n,v])=>`· ${n}：收 ${fmt(v.in)} / 送 ${fmt(v.out)}`);
    return `🤖 人情台账整理\n本月：收到 +${fmt(g.gin)}，送出 -${fmt(g.gout)}，净差 ${g.net>=0?'+':''}${fmt(g.net)}\n${lines.length?'往来明细：\n'+lines.join('\n'):'暂无份子记录'}\n提示：送出份子钱会从🏦存钱账户余额扣减，收到份子钱计入🏦存钱账户余额。`;
  }
  return `🤖 收到你的问题「${q}」。\n我是火焰兰 PersonalOS 的本地 AI 助手，基于你的本地数据可以帮你：今日复盘、任务计划、消费分析、人情台账整理。试试点击上方快捷指令吧～`;
}

function sendChat(){
  const el=$('#chatInput');const q=el.value.trim();if(!q)return;el.value='';pushChat(q);
}
function pushChat(q){
  S.chat.push({role:'user',text:q});
  S.chat.push({role:'ai',text:aiReply(q)});
  if(S.chat.length>40)S.chat=S.chat.slice(-40);
  save();render();
  setTimeout(()=>{const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight;},50);
}

const PAGES={home:pageHome,hub:pageHub,study:pageStudy,money:pageMoney,shift:pageShift,me:pageMe,acct:pageAcct};
function render(){
  let html=navHistory.length>0?`<div class="back-bar" onclick="goback()"><span class="bk">‹</span>返回</div>`:'';
  html+=PAGES[cur]();
  $('#pages').innerHTML=html;
  renderTabbar();
  if(cur==='me'){refreshCloudCard();}
  const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight;
}
applyTheme(curTheme());
renderFab();
render();
initCloud();
loadFloat();
initFloatDrag();
if(floatState.show)toggleFloatWin(true);
loadFabPos();
placeFab();
initFabDrag();
window.addEventListener('resize',()=>{const f=$('#fab');if(!f)return;const w=f.offsetWidth||54,h=f.offsetHeight||54;const x=Math.max(4,Math.min(fabPos.x,window.innerWidth-w-4));const y=Math.max(4,Math.min(fabPos.y,window.innerHeight-h-4));f.style.left=x+'px';f.style.top=y+'px';fabPos.x=x;fabPos.y=y;updateFabMenuAnchor();});
(function showSplash(){
  const now=new Date();
  const wd=['日','一','二','三','四','五','六'][now.getDay()];
  $('#splashDate').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${wd}`;
  const hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0');
  $('#splashTime').textContent=`${hh}:${mm}`;
  $('#splashMsg').textContent=splashEncourage(now.getHours());
  const ic=$('#splashIc');if(ic)ic.innerHTML=appLogoHTML();
  setTimeout(()=>{const s=$('#splash');if(s)s.classList.add('hide');},2200);
})();
/* PWA：注册 Service Worker + 捕获安装提示 */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
function splashEncourage(h){
  if(h<6) return '夜深了，照顾好自己，早点休息 🌙';
  if(h<11) return ['早安，今天的你依然闪闪发光 ✨','新的一天，慢慢来，会很好的 🌿','早上好呀，喝杯温水再开工 💧'][h%3];
  if(h<14) return ['午间小憩一下，给自己充个电 ☀️','忙碌的间隙，记得好好吃饭 🍚','保持节奏，你做得很棒 🌸'][h%3];
  if(h<18) return ['下午也要稳稳的，加油 💪','累了就伸个懒腰，别硬撑 🌿','你比昨天又进步了一点点 🌟'][h%3];
  if(h<22) return ['傍晚好，今天辛苦啦 🌇','收个尾，奖励自己一下吧 🍰','今晚也别忘了好好吃饭 🍲'][h%3];
  return '夜色温柔，放下手机早点睡 🌙';
}
