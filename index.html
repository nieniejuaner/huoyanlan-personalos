<style>
:root{
  --aqua:#c4f3f0; --grass:#dcf7d8; --coral:#f1bfbc; --bg:#f4deda;
  --ink:#222222; --sub:#777777; --card:#ffffff; --line:#f4deda;
  --shadow:0 2px 12px rgba(241,191,188,0.12);
  --r-card:18px; --r-btn:14px; --r-input:12px;
  --outline:rgba(150,95,88,.5);
  --hard:color-mix(in srgb, var(--coral) 55%, #ffffff);
  --fs:1;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:"SF Pro","SF Pro Text",system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size: calc(15px * var(--fs));line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
@media(min-width:900px){#app{max-width:680px}}
#pages{padding:16px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;transition:opacity .15s}
button:active{opacity:.6}
input,select,textarea{font-family:inherit;font-size: calc(15px * var(--fs));color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r-input);padding:10px 12px;width:100%;min-width:0;max-width:100%;background:var(--card);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--coral)}
textarea{resize:none;min-height:72px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:calc(18px * var(--fs));margin-bottom:14px}
.card-title{font-size: calc(13px * var(--fs));color:var(--sub);font-weight:600;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.h1{font-size: calc(22px * var(--fs));font-weight:700;letter-spacing:.3px}
/* 返回按钮：在可点击进入的页面顶部吸顶 */
.back-bar{position:sticky;top:0;z-index:58;display:flex;width:max-content;align-items:center;gap:3px;margin:0 0 10px;padding:6px 13px 6px 9px;border:2.5px solid var(--outline);border-radius:999px;background:var(--card);box-shadow:3px 3px 0 var(--hard);font-size: calc(14px * var(--fs));font-weight:600;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.back-bar .bk{font-size: calc(23px * var(--fs));line-height:1;margin-top:-3px;font-weight:700}
/* 头像 / 应用图标 */
.avatar{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--outline);box-shadow:3px 3px 0 var(--hard);background:var(--card);display:flex;align-items:center;justify-content:center;font-size: calc(30px * var(--fs));overflow:hidden;cursor:pointer;flex:none}
.avatar.sm{width:46px;height:46px;font-size: calc(24px * var(--fs))}
.avatar img{width:100%;height:100%;object-fit:cover}
.app-logo{width:60px;height:60px;border-radius:16px;border:2.5px solid var(--outline);box-shadow:3px 3px 0 var(--hard);background:linear-gradient(135deg,#f1bfbc,#c4f3f0);display:flex;align-items:center;justify-content:center;font-size: calc(32px * var(--fs));overflow:hidden;flex:none}
.app-logo img{width:100%;height:100%;object-fit:cover}
/* emoji 选择器 */
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-cell{font-size: calc(22px * var(--fs));padding:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;line-height:1}
.emoji-cell:active{background:var(--aqua)}
.emoji-cell.on{border-color:var(--coral);background:var(--aqua)}
.qe-ic{cursor:pointer;margin-right:3px;display:inline-block}

.sub{color:var(--sub);font-size: calc(12.5px * var(--fs))}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:60}
@media(min-width:900px){.tabbar{max-width:680px}}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size: calc(10.5px * var(--fs));color:var(--sub)}
.tab-item .ic{font-size: calc(21px * var(--fs));line-height:1;filter:grayscale(1);opacity:.55;transition:all .15s}
.tab-item.on{color:var(--ink);font-weight:600}
.tab-item.on .ic{filter:none;opacity:1}
/* 悬浮按钮 */
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:999px;background:var(--coral);color:#fff;font-size: calc(28px * var(--fs));font-weight:300;box-shadow:0 6px 18px rgba(241,191,188,.55);z-index:70;display:flex;align-items:center;justify-content:center;transition:transform .25s;touch-action:none;cursor:grab}
.fab:active{cursor:grabbing}
.fab.open{transform:rotate(45deg)}
.fab-mask{position:fixed;inset:0;background:rgba(34,34,34,.18);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:65}
.fab-mask.show{opacity:1;pointer-events:auto}
.fab-menu{position:fixed;right:18px;bottom:calc(148px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;gap:9px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s}
.fab-menu.show{opacity:1;pointer-events:auto;transform:none}
.fab-menu button{background:var(--card);border-radius:var(--r-btn);padding:10px 16px;font-size: calc(14px * var(--fs));font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab-menu.center{display:flex;flex-direction:row;gap:20px;align-items:flex-start}
.fab-menu.center .fab-col{display:flex;flex-direction:column;gap:9px}
.fab-menu.center .fab-col-l{align-items:flex-start}
.fab-menu.center .fab-col-r{align-items:flex-end}
/* 按钮 */
.btn{border-radius:var(--r-btn);padding:11px 18px;font-size: calc(14.5px * var(--fs));font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-coral{background:var(--coral);color:#fff}
.btn-grass{background:var(--grass);color:#3a5c36}
.btn-aqua{background:var(--aqua);color:#1f5b57}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size: calc(12.5px * var(--fs));border-radius:10px}
/* 标签chip */
.chip{display:inline-flex;align-items:center;background:var(--grass);color:#3a5c36;font-size: calc(11px * var(--fs));font-weight:600;border-radius:8px;padding:2px 8px}
.chip.aqua{background:var(--aqua);color:#1f5b57}
.chip.coral{background:var(--coral);color:#fff}
/* 进度条 */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--aqua);border-radius:99px;transition:width .3s}
/* 筛选段控 */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:10px;padding:7px 0;font-size: calc(13px * var(--fs));color:var(--sub);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.05)}
/* 任务条目 */
.task{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;touch-action:pan-y}
.task:last-child{border-bottom:none}
.task-inner{display:flex;align-items:center;gap:12px;flex:1;transition:transform .25s;background:inherit}
.ckbox{width:23px;height:23px;min-width:23px;border-radius:8px;border:1.8px solid var(--line);display:flex;align-items:center;justify-content:center;font-size: calc(13px * var(--fs));color:#fff;transition:all .15s}
.ckbox.done{background:var(--aqua);border-color:var(--aqua);color:#fff}
.task.done .t-title{color:#aaa;text-decoration:line-through}
.t-title{font-size: calc(15px * var(--fs));font-weight:500}
.t-meta{font-size: calc(11.5px * var(--fs));color:var(--sub);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swipe-acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch;transform:translateX(100%);transition:transform .25s}
.task.swiped .task-inner{transform:translateX(calc(var(--sw) * -1))}
.task.swiped .swipe-acts{transform:none}
.swipe-acts button{width:56px;font-size: calc(12px * var(--fs));color:#fff;font-weight:600}
.sa-edit{background:#d8c9a8}.sa-del{background:var(--coral)}.sa-stop{background:#b9b9b9}
/* 账单条目 */
.bill{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:none}
.bill-ic{width:34px;height:34px;min-width:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size: calc(16px * var(--fs));background:var(--line)}
.ov-acts{display:flex;gap:6px;flex-shrink:0}
.ov-acts .btn-sm{padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.g-sel{width:18px;height:18px;min-width:18px;accent-color:#f1bfbc;margin:0;align-self:flex-start;margin-top:10px}
.g-sum{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--line);border-radius:12px;font-size: calc(13px * var(--fs))}
.g-sum b{font-weight:700}
.g-sum .sub{margin-left:auto;color:var(--sub)}
.g-sum .btn-sm{color:#e0908b}
.amt-in{color:#3aa79f;font-weight:700}
.amt-out{color:#e0908b;font-weight:700}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(34,34,34,.3);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.modal-mask.show{opacity:1}
.modal{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(40px);transition:transform .25s}
.modal-mask.show .modal{transform:none}
@media(min-width:900px){.modal-mask{align-items:center}.modal{border-radius:24px;max-width:480px}}
.modal h3{font-size: calc(17px * var(--fs));font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal h3 .x{font-size: calc(20px * var(--fs));color:var(--sub);font-weight:400;padding:0 4px}
.f-label{font-size: calc(12.5px * var(--fs));color:var(--sub);font-weight:600;margin:13px 0 6px}
.cat-wrap{display:flex;flex-wrap:wrap;gap:8px}
.cat-item{padding:7px 14px;border-radius:10px;background:var(--line);font-size: calc(13px * var(--fs));font-weight:500;color:var(--sub)}
.cat-item.on{background:var(--coral);color:#fff;font-weight:600}
.cat-add{background:var(--grass);color:#3a5c36;font-weight:600}
/* 图表 */
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:26px;background:var(--aqua);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .3s}
.bar-lb{font-size: calc(10px * var(--fs));color:var(--sub)}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hbar-name{width:76px;font-size: calc(12.5px * var(--fs));color:var(--sub);text-align:right}
.hbar-track{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;min-width:2px;transition:width .3s}
.hbar-val{width:74px;font-size: calc(12px * var(--fs));font-weight:600}
/* 速记 */
.note-item{padding:12px 2px;border-bottom:1px solid var(--line)}
.note-item:last-child{border-bottom:none}
.note-txt{font-size: calc(14px * var(--fs));white-space:pre-wrap;word-break:break-word}
/* AI对话 */
.chat-box{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size: calc(13.5px * var(--fs));white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--coral);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.qcmd{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qcmd button{background:var(--grass);color:#3a5c36;font-size: calc(12px * var(--fs));font-weight:600;padding:6px 11px;border-radius:9px}
/* toast */
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(8px);background:rgba(34,34,34,.85);color:#fff;font-size: calc(13px * var(--fs));padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap}
.sw-update{position:fixed;top:0;left:0;right:0;z-index:210;background:var(--coral);color:#fff;text-align:center;padding:12px;font-size:calc(14px * var(--fs));font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25);display:none}
.sw-update.show{display:block;animation:suPop .3s ease}
@keyframes suPop{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.toast.show{opacity:1;transform:translateX(-50%)}
/* 设置行 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size: calc(14.5px * var(--fs))}
.font-ctl{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.font-ctl input[type=range]{flex:1;accent-color:var(--coral);height:26px}
.set-row:last-child{border-bottom:none}
.switch{width:46px;height:27px;border-radius:99px;background:#e7e0de;position:relative;transition:background .2s}
.theme-grid{display:flex;flex-wrap:wrap;gap:14px 12px}
.theme-item{display:flex;flex-direction:column;align-items:center;gap:7px;width:56px;cursor:pointer}
.theme-dot{width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.10);border:2.5px solid transparent;transition:transform .15s;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.theme-dot span{display:block;width:100%;height:100%}
.theme-item:active .theme-dot{transform:scale(.92)}
.theme-item.on .theme-dot{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.theme-name{font-size: calc(11px * var(--fs));color:var(--sub);text-align:center;line-height:1.25}
.theme-item.on .theme-name{color:var(--ink);font-weight:700}
.switch i{position:absolute;top:2.5px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:left .2s}
.switch.on{background:var(--aqua)}
.switch.on i{left:21px}
.img-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.empty{text-align:center;color:#bbb;font-size: calc(13px * var(--fs));padding:26px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acct-col{display:flex;flex-direction:column;gap:10px}
.acct-group-title{font-size: calc(12px * var(--fs));font-weight:600;color:var(--sub);margin:2px 2px 8px}
.acct-box{border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;text-align:left}
.acct-box .a-left{display:flex;flex-direction:column;gap:3px;min-width:0}
.acct-box .a-right{max-width:60%;text-align:right}
.acct-box .a-name{font-size: calc(13px * var(--fs));color:var(--sub);margin-bottom:0}
.acct-box .a-val{font-size: calc(17px * var(--fs));font-weight:700;letter-spacing:.2px;text-align:right;word-break:break-all}
.acct-box .a-month{font-size: calc(10.5px * var(--fs));color:var(--sub);margin-top:3px;text-align:right}
.acct-box .a-tip{font-size: calc(10px * var(--fs));color:var(--sub)}
.acct-box{cursor:pointer;-webkit-tap-highlight-color:transparent;justify-content:flex-start}
.acct-box .a-right{margin-left:auto}
.acct-go{margin-left:10px;color:var(--sub);font-size: calc(22px * var(--fs));font-weight:700;flex:none;line-height:1;transition:transform .15s}
.acct-box:active .acct-go{transform:translateX(3px)}
.page-anim{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 进入动画 */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .55s ease;opacity:1}
#splash.hide{opacity:0;pointer-events:none}
.splash-inner{text-align:center;padding:30px;animation:fadein .5s ease}
.splash-ic{font-size: calc(48px * var(--fs));animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.splash-date{font-size: calc(15px * var(--fs));color:var(--sub);margin-top:22px;letter-spacing:1.5px}

<script>
/* ================= 数据层（本地存储，隐私优先） ================= */
const KEY='huoyanlan_personalos_v1';
const DEF={
  profile:{nickname:'',birthday:'',saveGoal:'',budgetDaily:'',budgetMood:'',motto:'',avatar:''},
  settings:{remindSave:true,remindGift:true,remindTask:true,appIcon:''},

  todayMotto:{date:'',text:''},
  incomes:[],expenses:[],gifts:[],
  tasks:[],taskDone:{},taskSkip:{},taskImgs:{},
  notes:[],schedule:[],
  shifts:[],
  incomeCats:['工资','兼职','理财','红包','其他'],
  expenseCats:['餐饮','交通','购物','居家','医疗','其他'],
  moodCats:['娱乐','美妆','奶茶咖啡','游戏','宠爱自己','其他'],

  foods:[],sports:[],weights:[],

};
/* 排班班次类型（沿用四色规范 + 中性灰，保持低视觉干扰） */
const SHIFT_TYPES=[
  {key:'早班',color:'#c4f3f0'},
  {key:'午班',color:'#dcf7d8'},
  {key:'晚班',color:'#f1bfbc'},
  {key:'夜班',color:'#cdb4e0'},
  {key:'休息',color:'#ececec'},
  {key:'培训',color:'#bfe0ef'},
  {key:'会议',color:'#f4deda'},
  {key:'值班',color:'#f7d9a8'}
];
const shiftColor=t=>{const f=SHIFT_TYPES.find(x=>x.key===t);return f?f.color:'#e6e6e6';};
let S=null;
function mergeDef(d){const s=Object.assign(JSON.parse(JSON.stringify(DEF)),d||{});(s.shifts||[]).forEach(sh=>{if(sh.sdate===undefined){sh.sdate=sh.date||'';sh.stime=sh.start||'';sh.edate=sh.date||sh.sdate;sh.etime=sh.end||'';}});return s;}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);return mergeDef(d);}}catch(e){}return mergeDef({});}
async function save(){if(!S)return;S._ts=S._ts||Date.now();localStorage.setItem(KEY,JSON.stringify(S));scheduleSync();}
function commit(){save();render();}

/* ================= 应用锁（访问密码 · 本地加密） ================= */
const LOCK_KEY='huoyanlan_lock_v1';
let _sessKey=null;        // 解锁后的 AES CryptoKey（HTTPS）
let _sessXor=null;        // 解锁后的 XOR 密钥串（HTTP 兜底）
let _lockSalt=null;       // PBKDF2 salt
let _hasCrypto=!!(window.crypto&&crypto.subtle);
let _migratePlain=null;   // 首次设密码时迁移的旧明文数据
let _booted=false;        // 应用是否已完整启动（避免重复初始化）
let _alarmStarted=false;  // 计时器是否已启动

function randBytes(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
async function deriveAes(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function aesGcmEncrypt(key,str){
  const iv=randBytes(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(str));
  return {iv:Array.from(iv),ct:Array.from(new Uint8Array(ct))};
}
async function aesGcmDecrypt(key,ivArr,ctArr){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(ivArr)},key,new Uint8Array(ctArr));
  return new TextDecoder().decode(pt);
}
function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16);}
function xorStr(str,key){
  const enc=new TextEncoder().encode(str);const out=new Uint8Array(enc.length);
  for(let i=0;i<enc.length;i++)out[i]=enc[i]^key.charCodeAt(i%key.length);
  let bin='';for(let i=0;i<out.length;i++)bin+=String.fromCharCode(out[i]);
  return btoa(bin);
}
function xorStrBack(b64,key){
  const bin=atob(b64);const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i)^key.charCodeAt(i%key.length);
  return new TextDecoder().decode(out);
}
async function lockEncrypt(obj){
  const json=JSON.stringify(obj);
  if(_hasCrypto&&_sessKey){const b=await aesGcmEncrypt(_sessKey,json);return {v:3,kind:'aes',salt:(_lockSalt?Array.from(_lockSalt):null),iv:b.iv,ct:b.ct};}
  if(_sessXor){return {v:3,kind:'xor',ct:xorStr(json,_sessXor)};}
  throw new Error('未解锁');
}
async function lockDecrypt(rec){
  if(rec&&rec.kind==='aes'&&_sessKey){return JSON.parse(await aesGcmDecrypt(_sessKey,rec.iv,rec.ct));}
  if(rec&&rec.kind==='xor'&&_sessXor){return JSON.parse(xorStrBack(rec.ct,_sessXor));}
  if(rec&&!rec.kind){return rec;} // 兼容未加密的旧明文
  throw new Error('无法解密');
}
async function lockStore(obj){localStorage.setItem(KEY,JSON.stringify(await lockEncrypt(obj)));}
function probePlain(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&typeof d==='object'&&!d.kind)return d;}}catch(e){}
  return null;
}
async function lockSetup(pw){
  try{
    const salt=_hasCrypto?randBytes(16):'huoyanlan';
    let rec;
    if(_hasCrypto){
      _sessKey=await deriveAes(pw,salt);_lockSalt=salt;
      const check=await aesGcmEncrypt(_sessKey,'huoyanlan-ok');
      rec={v:2,kind:'aes',salt:Array.from(salt),check:check,secqa:getSecQA()};
    }else{
      _sessXor=hashStr(pw+'huoyanlan');
      rec={v:2,kind:'xor',salt:'huoyanlan',check:hashStr(pw+'huoyanlan'),secqa:getSecQA()};
    }
    localStorage.setItem(LOCK_KEY,JSON.stringify(rec));
    const data=S?S:(_migratePlain||JSON.parse(JSON.stringify(DEF)));
    await lockStore(data);_migratePlain=null;
    toast('密码已设置 🔒');

async function lockUnlock(pw){
  const raw=localStorage.getItem(LOCK_KEY);
  if(!raw){return lockSetup(pw);}
  let rec;try{rec=JSON.parse(raw);}catch(e){toast('锁配置损坏');return false;}
  try{
    if(rec.kind==='aes'){
      if(!_hasCrypto){toast('请使用 GitHub Pages(HTTPS) 链接打开以解锁');return false;}
      const salt=new Uint8Array(rec.salt);
      _sessKey=await deriveAes(pw,salt);
      const ok=await aesGcmDecrypt(_sessKey,rec.check.iv,rec.check.ct);
      if(ok!=='huoyanlan-ok'){_sessKey=null;toast('密码错误');return false;}
      _lockSalt=salt;
    }else{
      _sessXor=hashStr(pw+'huoyanlan');
      if(hashStr(pw+'huoyanlan')!==rec.check){_sessXor=null;toast('密码错误');return false;}
    }
    const dr=localStorage.getItem(KEY);let data;
    if(!dr){data=JSON.parse(JSON.stringify(DEF));}
    else{try{data=await lockDecrypt(JSON.parse(dr));}catch(e){_sessKey=null;_sessXor=null;toast('解密失败，密码可能错误');return false;}}
    S=mergeDef(data);
    afterUnlock();
    return true;
  }catch(e){_sessKey=null;_sessXor=null;toast('解锁失败');return false;}
}
async function verifyLockPassword(pw){
  const raw=localStorage.getItem(LOCK_KEY);if(!raw)return false;
  const rec=JSON.parse(raw);
  if(rec.kind==='aes'){if(!_hasCrypto)return false;const k=await deriveAes(pw,new Uint8Array(rec.salt));try{return (await aesGcmDecrypt(k,rec.check.iv,rec.check.ct))==='huoyanlan-ok';}catch(e){return false;}}
  return hashStr(pw+'huoyanlan')===rec.check;
}

  else{_sessXor=hashStr(newPw+'huoyanlan');rec={v:2,kind:'xor',salt:'huoyanlan',check:hashStr(newPw+'huoyanlan')};}

const LOCK_CLOUD_PATH='lock.json';

let _lockCloudErr=false;   // 云已连接但拉取锁失败（令牌/网络异常）

async function ghLockGet(){
  const p=ghRepoParts();p.path=LOCK_CLOUD_PATH;
  const url=`${GH_API}/repos/${encodeURIComponent(p.owner)}/${encodeURIComponent(p.name)}/contents/${encodeURIComponent(p.path)}?ref=${encodeURIComponent(p.branch)}`;
  const res=await fetch(url,{headers:ghHeaders()});
  if(res.status===404)return {ok:true,sha:null,raw:null};
  if(res.status===401)return {ok:false,err:'令牌无效（401）'};
  if(res.status===403)return {ok:false,err:'禁止访问（403）'};
  if(!res.ok)return {ok:false,err:'HTTP '+res.status};
  const j=await res.json();
  try{return {ok:true,sha:j.sha,raw:ghB64decode(j.content)};}
  catch(e){return {ok:false,err:'云端锁解析失败'};}
}
async function ghLockPut(rec,sha){
  const p=ghRepoParts();p.path=LOCK_CLOUD_PATH;
  const url=`${GH_API}/repos/${encodeURIComponent(p.owner)}/${encodeURIComponent(p.name)}/contents/${encodeURIComponent(p.path)}`;
  const body={message:'PersonalOS 锁状态同步',content:ghB64encode(JSON.stringify(rec)),branch:ghCfg().branch};
  if(sha)body.sha=sha;
  let res=await fetch(url,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(res.status===409&&sha){const g=await ghLockGet();if(g.ok&&g.sha){body.sha=g.sha;res=await fetch(url,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});}}
  return res;
}
async function ghLockDelete(){
  const p=ghRepoParts();p.path=LOCK_CLOUD_PATH;
  const url=`${GH_API}/repos/${encodeURIComponent(p.owner)}/${encodeURIComponent(p.name)}/contents/${encodeURIComponent(p.path)}`;
  const g=await ghLockGet();if(!g.ok||!g.sha)return;
  await fetch(url,{method:'DELETE',headers:ghHeaders(),body:JSON.stringify({message:'remove lock',sha:g.sha})});
}
async function lockPushCloud(){
  if(!ghCredReady())return;
  const rec=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');if(!rec)return;
  try{const g=await ghLockGet();if(g.ok){await ghLockPut(rec,g.sha||null);_lockCloudSha=g.sha;}}catch(e){}

      else if(g.ok&&!g.raw){await lockPushCloud();_lockGlobal=true;}

function ghConnected(){const c=ghCfg();return cloudState.on&&!!c.token&&!!c.repo;}

function ghRepoParts(){

function ghHeaders(){
  const c=ghCfg();
  return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
}
function ghB64encode(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\n/g,'');
}
function ghB64decode(b64){
  const bin=atob(b64.replace(/\s/g,''));const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function cloudHasContent(){

async function ghGet(){
  const res=await fetch(ghFileUrl(),{headers:ghHeaders()});
  if(res.status===404)return {ok:true,sha:null,raw:null};
  if(res.status===401)return {ok:false,err:'令牌无效或无权限（401）'};
  if(res.status===403)return {ok:false,err:'禁止访问（403，权限不足或额度用尽）'};
  if(!res.ok)return {ok:false,err:'HTTP '+res.status};
  const j=await res.json();
  try{return {ok:true,sha:j.sha,raw:ghB64decode(j.content)};}
  catch(e){return {ok:false,err:'云端数据解析失败'};}
}
async function ghPut(content,sha){
  const body={message:'PersonalOS 自动同步 '+new Date().toLocaleString('zh-CN'),content:content,branch:ghCfg().branch};
  if(sha)body.sha=sha;
  let res=await fetch(ghFilePutUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  if(res.status===409&&sha){
    const g=await ghGet();
    if(g.ok&&g.sha){body.sha=g.sha;res=await fetch(ghFilePutUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});}
  }
  return res;
}
async function cloudPush(){
  if(!ghConnected())return;
  // 安全保护：本机无实质数据时，若云端有内容则以云端为准，避免上传空数据覆盖云端备份
  if(!cloudHasContent()){
    const g=await ghGet();
    if(g.ok&&g.raw){ try{ const o=JSON.parse(g.raw); if(cloudObjRich(o)){ await cloudApply(o); cloudSetStatus('ok','本机无数据，已保留云端'); return; } }catch(e){} }
  }
  S._ts=Date.now();
  const payload=S;
  const enc=payload;
  const raw=JSON.stringify(enc);
  if(raw.length>900000){cloudSetStatus('error','数据过大（含图片可能超 1MB），请先「清除缓存图片」');return;}
  cloudSetStatus('syncing');
  try{
    const g=await ghGet();
    if(!g.ok){cloudSetStatus('error',g.err);return;}
    let remoteTs=0;
    if(g.raw){try{const obj=JSON.parse(g.raw);remoteTs=obj._ts||0;}catch(e){}}
    if(remoteTs>(payload._ts||0)){cloudSetStatus('ok','云端已有更新，已保留');try{const obj=JSON.parse(g.raw);await cloudApply(obj);}catch(e){}return;}
    const res=await ghPut(ghB64encode(raw),g.sha);
    if(res.ok){cloudState.last=Date.now();cloudSetStatus('ok','已同步 · '+fmtClock(cloudState.last));}
    else if(res.status===401){cloudSetStatus('error','令牌无效（401）');}
    else if(res.status===403){cloudSetStatus('error','禁止访问（403）');}
    else if(res.status===404){cloudSetStatus('error','仓库或文件路径不存在（404）');}
    else{cloudSetStatus('error','上传失败 '+res.status);}
  }catch(e){cloudSetStatus('error','网络异常');}
}
async function cloudApply(obj){
  if(!obj)return;
  S=mergeDef(obj);save();
  if(cur==='me')refreshCloudCard();else render();
  toast('已从云端恢复');
}
async function cloudPull(force){
  if(!ghConnected()){cloudSetStatus('off','未连接');return false;}
  cloudSetStatus('syncing');
  try{
    const g=await ghGet();
    if(!g.ok){cloudSetStatus('error',g.err);return false;}
    if(!g.raw){cloudSetStatus('ok','云端暂无数据');return false;}
    let obj;
    try{ obj=JSON.parse(g.raw); }
    catch(e){ cloudSetStatus('error','云端数据解析失败'); return false; }
    const ct=obj._ts||0;
    if(force||!S._ts||ct>S._ts){
      await cloudApply(obj);
      cloudState.last=Date.now();cloudSetStatus('ok','已从云端恢复 · '+fmtClock(cloudState.last));
      return true;
    }
    cloudSetStatus('ok','本地已是最新');
    return true;
  }catch(e){cloudSetStatus('error','网络异常');return false;}
}
async function decryptCloudWithPw(rec,pw){
  if(rec.kind==='aes'){
    const salt=rec.salt?new Uint8Array(rec.salt):(_lockSalt?new Uint8Array(_lockSalt):null);
    if(!salt)throw new Error('缺少 salt');
    const k=await deriveAes(pw,salt);
    const json=await aesGcmDecrypt(k,rec.iv,rec.ct);
    _sessKey=k;_lockSalt=salt;_sessXor=null;
    const check=await aesGcmEncrypt(_sessKey,'huoyanlan-ok');
    localStorage.setItem(LOCK_KEY,JSON.stringify({v:2,kind:'aes',salt:Array.from(salt),check:check}));
    if(ghCredReady())lockPushCloud();
    return JSON.parse(json);
  } else if(rec.kind==='xor'){
    const xk=hashStr(pw+'huoyanlan');
    const json=xorStrBack(rec.ct,xk);
    _sessXor=xk;_sessKey=null;
    localStorage.setItem(LOCK_KEY,JSON.stringify({v:2,kind:'xor',salt:'huoyanlan',check:xk}));
    if(ghCredReady())lockPushCloud();
    return JSON.parse(json);
  }
  return rec;
}

  localStorage.setItem(GH_PATH_KEY,p);

      cloudState.on=false;localStorage.setItem(CLOUD_ON_KEY,'0');

function balances(){
  const b={save:0,daily:0,mood:0};
  S.incomes.forEach(i=>{b.save+=Number(i.alloc.save)||0;b.daily+=Number(i.alloc.daily)||0;b.mood+=Number(i.alloc.mood)||0;});
  S.expenses.forEach(e=>{b[e.account]-=Number(e.amount)||0;});
  S.gifts.forEach(g=>{const a=Number(g.amount)||0;b.save+= g.type==='out'?-a:a;});
  return b;
}
function monthBalances(){
  const m=today().slice(0,7);
  const b={save:0,daily:0,mood:0};
  S.incomes.forEach(i=>{if((i.date||'').slice(0,7)!==m)return;b.save+=Number(i.alloc.save)||0;b.daily+=Number(i.alloc.daily)||0;b.mood+=Number(i.alloc.mood)||0;});
  S.expenses.forEach(e=>{if((e.date||'').slice(0,7)!==m)return;b[e.account]-=Number(e.amount)||0;});
  S.gifts.forEach(g=>{if((g.date||'').slice(0,7)!==m)return;const a=Number(g.amount)||0;b.save+=g.type==='out'?-a:a;});
  return b;
}
function todayFlow(){
  const t=today();let inc=0,exp=0,moodExp=0,dailyExp=0;
  S.incomes.forEach(i=>{if(i.date===t)inc+=Number(i.total)||0;});
  S.expenses.forEach(e=>{if(e.date===t){exp+=Number(e.amount)||0;if(e.account==='mood')moodExp+=Number(e.amount)||0;else dailyExp+=Number(e.amount)||0;}});
  return{inc,exp,moodExp,dailyExp};
}
function giftStat(range){
  let gin=0,gout=0;const t=today(),month=t.slice(0,7);
  S.gifts.forEach(g=>{
    if(range==='today'&&g.date!==t)return;
    if(range==='month'&&(g.date||'').slice(0,7)!==month)return;
    if(g.type==='in')gin+=Number(g.amount)||0;else gout+=Number(g.amount)||0;
  });
  return{gin,gout,net:gin-gout};
}

function taskActive(t,date){
  date=date||today();
  if(t.type==='temp')return t.createdDate===date;
  if(t.endedDate&&date>=t.endedDate)return false;
  if((S.taskSkip[t.id]||[]).includes(date))return false;
  if(date<t.createdDate)return false;
  if(t.repeatType==='forever')return true;
  if(t.repeatType==='days'){const diff=(new Date(date)-new Date(t.createdDate))/86400000;return diff>=0&&diff<Number(t.repeatN||1);}
  if(t.repeatType==='weekly'){const wd=new Date(date+'T00:00:00').getDay();return (t.weekdays||[]).includes(wd);}
  return false;
}

function saveFabPos(){try{localStorage.setItem(FAB_KEY,JSON.stringify(fabPos));}catch(e){}}
function placeFab(){
  const f=$('#fab');if(!f)return;const w=f.offsetWidth||54,h=f.offsetHeight||54;
  if(fabPos.x==null||fabPos.y==null){fabPos.x=window.innerWidth-w-18;fabPos.y=window.innerHeight-h-90;}
  fabPos.x=Math.max(4,Math.min(fabPos.x,window.innerWidth-w-4));
  fabPos.y=Math.max(4,Math.min(fabPos.y,window.innerHeight-h-4));
  f.style.left=fabPos.x+'px';f.style.top=fabPos.y+'px';
  updateFabMenuAnchor();
}
function updateFabMenuAnchor(){
  const f=$('#fab'),m=$('#fabMenu');if(!f||!m)return;const w=f.offsetWidth||54,h=f.offsetHeight||54;
  const cx=f.offsetLeft+w/2,cy=f.offsetTop+h/2,midX=window.innerWidth/2,midY=window.innerHeight/2;
  const band=window.innerWidth*0.12; // 中央带状区判定
  const centerH=Math.abs(cx-midX)<=band;
  const mode=centerH?'center':(cx<midX?'left':'right');
  if(m._fabMode!==mode){m._fabMode=mode;renderFabMenuCols(mode);}
  // 重置可能残留的水平定位
  m.style.left='';m.style.right='';m.style.transform='';m.style.maxWidth='';m.style.alignItems='';
  m.classList.toggle('center',centerH);
  if(centerH){
    // 中央：两列布局，整块水平居中
    m.style.left='50%';m.style.transform='translateX(-50%)';
    m.style.maxWidth=(window.innerWidth-16)+'px';
  }else if(mode==='left'){
    // 左侧半区：向右展开、左对齐
    m.style.left=f.offsetLeft+'px';m.style.right='auto';
    m.style.alignItems='flex-start';
    m.style.maxWidth=(window.innerWidth-f.offsetLeft-8)+'px';
  }else{
    // 右侧半区：向左展开、右对齐
    m.style.right=(window.innerWidth-(f.offsetLeft+w))+'px';m.style.left='auto';
    m.style.alignItems='flex-end';
    m.style.maxWidth=(f.offsetLeft+w-8)+'px';
  }
  const topHalf=cy<midY;
  if(topHalf){
    m.style.top=(f.offsetTop+h+8)+'px';m.style.bottom='auto';
    m.style.maxHeight=(window.innerHeight-f.offsetTop-h-16)+'px';
  }else{
    m.style.bottom=(window.innerHeight-f.offsetTop+8)+'px';m.style.top='auto';
    m.style.maxHeight=(f.offsetTop-16)+'px';
  }
  m.style.overflowY='auto';
}
function initFabDrag(){
  const f=$('#fab');if(!f)return;let sx,sy,ox,oy,drag=false,moved=false;
  f.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=f.offsetLeft;oy=f.offsetTop;try{f.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  f.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;if(!moved)return;let nx=ox+dx,ny=oy+dy;nx=Math.max(4,Math.min(nx,window.innerWidth-f.offsetWidth-4));ny=Math.max(4,Math.min(ny,window.innerHeight-f.offsetHeight-4));f.style.left=nx+'px';f.style.top=ny+'px';});
  f.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(moved){fabPos.x=f.offsetLeft;fabPos.y=f.offsetTop;saveFabPos();updateFabMenuAnchor();}else{toggleFab();}});
  f.addEventListener('pointercancel',()=>{drag=false;});
}

/* ================= 弹窗系统 ================= */
function openModal(html){
  $('#modalRoot').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  requestAnimationFrame(()=>$('#modalRoot .modal-mask').classList.add('show'));
}
function closeModal(){
  const m=$('#modalRoot .modal-mask');if(!m)return;
  m.classList.remove('show');setTimeout(()=>$('#modalRoot').innerHTML='',220);
}
function readImg(input,cb){
  const f=input.files&&input.files[0];if(!f){cb('');return;}
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');const max=480;
      let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}

/* ================= 语音/文字指令 + 任务闹钟计时 ================= */
const WMAP={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
function cmdAdd(d){const x=new Date();x.setDate(x.getDate()+d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function cmdDate(text){
  if(/大后天/.test(text))return cmdAdd(3);
  if(/后天/.test(text))return cmdAdd(2);
  if(/(明早|明晨)/.test(text))return cmdAdd(1);
  if(/(明天|明日)/.test(text))return cmdAdd(1);
  if(/(今天|今日|现在)/.test(text))return cmdAdd(0);
  const wm=text.match(/[周星礼]拜?([日天一二三四五六])/);
  if(wm){const tg=WMAP[wm[1]];let diff=(tg-new Date().getDay()+7)%7;if(diff===0)diff=7;return cmdAdd(diff);}
  const md=text.match(/(\d{1,2})月(\d{1,2})[日号]/);
  if(md){const m=+md[1],d=+md[2];const y=new Date().getFullYear()+(m<new Date().getMonth()+1?1:0);return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  const sl=text.match(/(\d{1,2})\/(\d{1,2})/);
  if(sl){const m=+sl[1],d=+sl[2];const y=new Date().getFullYear()+(m<new Date().getMonth()+1?1:0);return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  return '';
}
function cmdTime(text){
  let pm=/下午|晚上|傍晚|夜里/.test(text),am=/上午|早上|早晨|清晨|早/.test(text),base=/中午/.test(text)?12:0;
  let h,m=0,has=false;
  let mt=text.match(/(\d{1,2})[:：](\d{1,2})/);
  if(mt){h=+mt[1];m=+mt[2];has=true;}
  else{let hm=text.match(/(\d{1,2})\s*点\s*(半|(\d{1,2})分)?/);if(hm){h=+hm[1];if(hm[2]==='半')m=30;else if(hm[2])m=+hm[2];has=true;}}
  if(!has)return null;
  if(pm&&h<12)h+=12;if(am&&h===12)h=0;if(base===12&&h===undefined)h=12;
  if(h===undefined)return null;
  h=(h%24+24)%24;
  return {h,m,str:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
}
function cmdAmount(text){const m=text.match(/(?:¥|￥)?\s*(\d+(?:\.\d+)?)\s*(?:元|块|块钱)?/);return m?parseFloat(m[1]):0;}
const CAT_MAP=[['工资','工资'],['薪','工资'],['奖金','奖金'],['报销','报销'],['分红','分红'],['返现','其他'],['利息','利息'],
 ['吃','餐饮'],['饭','餐饮'],['餐','餐饮'],['外卖','餐饮'],['咖啡','餐饮'],['奶茶','餐饮'],['零食','餐饮'],
 ['打车','交通'],['滴滴','交通'],['地铁','交通'],['公交','交通'],['加油','交通'],['高铁','交通'],['火车','交通'],['机票','交通'],['车','交通'],['油','交通'],
 ['购物','购物'],['衣服','购物'],['鞋','购物'],['淘宝','购物'],['京东','购物'],['买','购物'],
 ['房租','居住'],['租','居住'],['物业','居住'],['水电','居住'],['话费','居住'],['宽带','居住'],
 ['医','医疗'],['药','医疗'],['医院','医疗'],['体检','医疗'],
 ['电影','娱乐'],['游戏','娱乐'],['旅游','娱乐'],['会员','娱乐'],['玩','娱乐'],
 ['书','学习'],['课','学习'],['学','学习'],['培训','学习'],
 ['红包','人情'],['份子','人情'],['礼','人情']];
function cmdCat(text,def){for(const k of CAT_MAP)if(text.includes(k[0]))return k[1];return def||'其他';}
function cmdRepeat(text){
  if(/每天|每日|天天|永久|一直|长期/.test(text))return 'forever';
  if(/每周|每星期|礼拜/.test(text))return 'weekly';
  const dm=text.match(/连续\s*(\d+)\s*天/);if(dm)return {type:'days',n:+dm[1]};
  return null;
}
function cmdAlarm(text){
  const a={type:'none',mins:0,at:''};
  let cd=text.match(/倒计时\s*(\d+(?:\.\d+)?)\s*(分钟|分|min|小时|h)/);
  if(cd){let v=parseFloat(cd[1]);if(/小时|h/.test(cd[2]))v*=60;a.type='countdown';a.mins=Math.round(v);return a;}
  let cd2=text.match(/(\d+(?:\.\d+)?)\s*(分钟|分)\s*(?:后|之后|钟后)?\s*(?:提醒|闹钟|叫|提醒我)/);
  if(cd2){a.type='countdown';a.mins=Math.round(parseFloat(cd2[1]));return a;}
  if(/计时|秒表|计时器/.test(text)){a.type='timer';return a;}
  if(/定时|提醒|闹钟|叫醒|叫我|提醒我/.test(text)){
    const tm=cmdTime(text),dt=cmdDate(text);
    if(tm){a.type='scheduled';a.at=(dt||today())+'T'+tm.str;}
    else a.type='none';
    return a;
  }
  return a;
}
function cmdTitle(text){
  let s=text;
  s=s.replace(/今天|今日|现在|明天|明日|明早|明晨|后天|大后天|下?[周星礼]拜?[日天一二三四五六]/g,'')
    .replace(/\d{1,2}月\d{1,2}[日号]/g,'').replace(/\d{1,2}\/\d{1,2}/g,'')
    .replace(/上午|早上|早晨|清晨|中午|下午|晚上|傍晚|夜里/g,'')
    .replace(/\d{1,2}[:：]\d{1,2}/g,'').replace(/\d{1,2}\s*点\s*(?:半|\d{1,2}分)?/g,'').replace(/\d{1,2}\s*点/g,'')
    .replace(/倒计时\s*\d+(?:\.\d+)?\s*(?:分钟|分|小时|h|min)/g,'').replace(/\d+(?:\.\d+)?\s*(?:分钟|分|小时|h)\s*(?:后|之后|钟后)?\s*(?:提醒|闹钟|叫|提醒我)/g,'')
    .replace(/每天|每日|天天|永久|一直|长期|每周|每星期|连续\s*\d+\s*天|定时|提醒我|提醒|闹钟|叫醒|叫我|叫|计时|秒表|计时器/g,'')
    .replace(/帮我|请|创建|新建|设个|一个|一下|我要|我想|添加|增加|记一笔|记账|支出|收入|花了|花掉|开销|消费|付了|付给|买了|赚|工资|进账|收款|报销|奖金|红包|份子|¥|￥|\d+(?:\.\d+)?\s*元|\d+(?:\.\d+)?\s*块/g,'')
    .replace(/[，,。.！!？?\s]+/g,'');
  return s.trim().slice(0,40)||'新任务';
}
function parseCommand(text){
  const p={intent:'task',title:'',date:'',time:'',repeat:null,amount:0,category:'',account:'',note:'',alarm:{type:'none',mins:0,at:''},timer:false,raw:text};
  text=String(text||'');
  const isIncome=/收入|赚|工资|发工资|进账|收款|报销|奖金|返现|利息|分红|红包|份子/.test(text);
  const isExpense=(/支出|花了|花掉|开销|消费|付了|付给|买了|记一笔|记账|[¥￥]|\d+\s*(?:元|块)/.test(text))&&!isIncome;
  if(isIncome)p.intent='income';else if(isExpense)p.intent='expense';else p.intent='task';
  p.date=cmdDate(text);
  const tm=cmdTime(text);if(tm)p.time=tm.str;
  p.repeat=cmdRepeat(text);
  p.alarm=cmdAlarm(text);
  if(p.alarm.type==='timer')p.timer=true;
  if(p.intent!=='task'){p.amount=cmdAmount(text);p.category=cmdCat(text,p.intent==='income'?'工资':'餐饮');let ttl=cmdTitle(text).replace(/\d+(\.\d+)?/g,'').trim();p.title=ttl||p.category;}
  else p.title=cmdTitle(text);
  return p;
}

function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  const ta=$('#cmdText'),mic=$('#cmdMic');

  r.onerror=()=>{toast('识别失败，可改用键盘听写');if(mic)mic.textContent='🎙 重试';r._on=false;};
  r.onend=()=>{r._on=false;if(mic)mic.textContent='🎙 说话';};
  try{r.start();if(mic)mic.textContent='🛑 停止';}catch(e){toast('无法启动麦克风');}
}
function runCmd(){

    if(p.alarm.type==='countdown')t.alarm={type:'countdown',mins:p.alarm.mins,deadline:Date.now()+p.alarm.mins*60000,on:true};
    else if(p.alarm.type==='scheduled'&&p.alarm.at)t.alarm={type:'scheduled',at:p.alarm.at,on:true};
    if(p.alarm.type==='timer')t.timer={acc:0,running:true,startedAt:Date.now()};

/* 闹钟 / 计时 运行时 */
function fmtDur(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h>0?h+':':'')+String(m).padStart(h>0?2:1,'0')+':'+String(x).padStart(2,'0');}
let _ac=null;
function beep(times){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended')_ac.resume();
    const now=_ac.currentTime;times=times||3;
    for(let i=0;i<times;i++){
      const o=_ac.createOscillator(),g=_ac.createGain();
      o.type='sine';o.frequency.value=880;o.connect(g);g.connect(_ac.destination);
      const st=now+i*0.35;
      g.gain.setValueAtTime(0.001,st);
      g.gain.exponentialRampToValueAtTime(0.3,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,st+0.3);
      o.start(st);o.stop(st+0.32);
    }
  }catch(e){}
}
function ensureNotify(){if('Notification'in window&&Notification.permission==='default'){try{Notification.requestPermission();}catch(e){}}}
function fireAlarm(t,label){beep(3);ensureNotify();if('Notification'in window&&Notification.permission==='granted'){try{new Notification('⏰ 火焰兰提醒',{body:label});}catch(e){}}toast('⏰ '+label);}
function alarmTick(){
  if(!S)return;
  const now=Date.now();let needSave=false;
  S.tasks.forEach(t=>{
    const tm=t.timer||{};
    if(tm.running){const el=document.getElementById('tmr-'+t.id);if(el)el.textContent=fmtDur((tm.acc||0)+(now-(tm.startedAt||now))/1000);}
    const al=t.alarm||{};
    if(al.on&&al.type==='countdown'&&al.deadline){
      const left=(al.deadline-now)/1000;const el=document.getElementById('alm-'+t.id);if(el)el.textContent='⏰ '+fmtDur(Math.max(0,left));
      if(left<=0){al.on=false;fireAlarm(t,(t.title||'任务')+' · 倒计时结束');needSave=true;}
    }
    if(al.on&&al.type==='scheduled'&&al.at){
      if(now>=new Date(al.at).getTime()){al.on=false;fireAlarm(t,(t.title||'任务')+' · 定时到了');needSave=true;}
    }
  });
  if(needSave)save();
}
function startTimer(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.timer=t.timer||{acc:0,running:false,startedAt:0};if(t.timer.running)return;t.timer.running=true;t.timer.startedAt=Date.now();save();}
function pauseTimer(id){const t=S.tasks.find(x=>x.id===id);if(!t||!t.timer||!t.timer.running)return;t.timer.acc=(t.timer.acc||0)+(Date.now()-(t.timer.startedAt||Date.now()))/1000;t.timer.running=false;save();}
function resetTimer(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.timer={acc:0,running:false,startedAt:0};save();}
function setCountdown(id,mins){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.alarm=t.alarm||{type:'none',mins:0,at:'',on:false,deadline:0};t.alarm.type='countdown';t.alarm.mins=Math.round(mins);t.alarm.deadline=Date.now()+Math.round(mins*60000);t.alarm.on=true;ensureNotify();save();toast('⏰ 倒计时已设置');}
function setScheduled(id,at){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.alarm=t.alarm||{type:'none',mins:0,at:'',on:false,deadline:0};t.alarm.type='scheduled';t.alarm.at=at;t.alarm.on=true;ensureNotify();save();toast('⏰ 定时已设置');}
function cancelAlarm(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.alarm=t.alarm||{type:'none',mins:0,at:'',on:false,deadline:0};t.alarm.on=false;t.alarm.type='none';save();}
function taskTimerHTML(t){
  const tm=t.timer||{};const run=!!tm.running;
  const cur=run?fmtDur((tm.acc||0)+(Date.now()-(tm.startedAt||Date.now()))/1000):fmtDur(tm.acc||0);
  return `<div class="tmr-row"><span class="chip aqua">⏱ <b id="tmr-${t.id}">${cur}</b></span>
    <button class="btn-sm" onclick="${run?'pauseTimer':'startTimer'}('${t.id}')">${run?'⏸ 暂停':'▶ 计时'}</button>
    <button class="btn-sm" onclick="resetTimer('${t.id}')">⟲ 清零</button></div>`;
}
function taskAlarmHTML(t){
  const al=t.alarm||{};if(!al.on)return '';
  const el='alm-'+t.id;
  const txt=al.type==='countdown'?'⏰ '+(al.deadline?fmtDur(Math.max(0,(al.deadline-Date.now())/1000)):(al.mins||0)+'分'):'⏰ 定时 '+(al.at?al.at.replace('T',' '):'');
  return `<div class="tmr-row"><span class="chip coral"><b id="${el}">${txt}</b></span><button class="btn-sm" onclick="cancelAlarm('${t.id}')">✕ 取消</button></div>`;
}

function crc32(buf){
  const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  let crc=0xFFFFFFFF;for(let i=0;i<buf.length;i++)crc=t[(crc^buf[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function buildXlsx(files){
  const enc=new TextEncoder();
  const parts=[];const central=[];let offset=0;
  files.forEach(f=>{
    const data=enc.encode(f[1]);
    const crc=crc32(data);
    const nameBytes=enc.encode(f[0]);
    const size=data.length;
    const lh=new Uint8Array(30+nameBytes.length);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
    dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,crc,true);dv.setUint32(18,size,true);dv.setUint32(22,size,true);
    dv.setUint16(26,nameBytes.length,true);dv.setUint16(28,0,true);lh.set(nameBytes,30);
    parts.push(lh);parts.push(data);
    const cd=new Uint8Array(46+nameBytes.length);
    const cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
    cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,size,true);cv.setUint32(24,size,true);
    cv.setUint16(28,nameBytes.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);cv.setUint32(42,offset,true);cd.set(nameBytes,46);
    central.push(cd);offset+=lh.length+data.length;
  });
  const centralSize=central.reduce((s,c)=>s+c.length,0);
  const out=new Uint8Array(offset+centralSize+22);
  let p=0;
  parts.forEach(part=>{out.set(part,p);p+=part.length;});
  const cs=p;
  central.forEach(c=>{out.set(c,p);p+=c.length;});
  const ed=new DataView(out.buffer,cs+centralSize);
  ed.setUint32(0,0x06054b50,true);ed.setUint16(4,0,true);ed.setUint16(6,0,true);
  ed.setUint16(8,files.length,true);ed.setUint16(10,files.length,true);
  ed.setUint32(12,centralSize,true);ed.setUint32(16,offset,true);ed.setUint16(20,0,true);
  return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function downloadExcel(name,header,rows){
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const colLetter=n=>{let s='';while(n>0){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26);}return s;};
  let body='';
  [header].concat(rows).forEach((r,ri)=>{
    let cells='';r.forEach((c,ci)=>{const ref=colLetter(ci+1)+(ri+1);cells+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(c==null?'':c)}</t></is></c>`;});
    body+=`<row r="${ri+1}">${cells}</row>`;
  });
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
  const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="账单" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const blob=buildXlsx([['[Content_Types].xml',contentTypes],['_rels/.rels',rootRels],['xl/workbook.xml',workbook],['xl/_rels/workbook.xml.rels',rels],['xl/worksheets/sheet1.xml',sheet]]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.xlsx';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function curYM(){if(!shiftMonth){const d=new Date();shiftMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}return shiftMonth;}
function shiftsForDate(ds){return S.shifts.filter(s=>ds>=(s.sdate||'')&&ds<=(s.edate||s.sdate||'')).sort((a,b)=>String(a.stime||'').localeCompare(String(b.stime||'')));}
function daySpan(s){const a=new Date(s.sdate),b=new Date(s.edate||s.sdate);if(isNaN(a)||isNaN(b))return 1;return Math.round((b-a)/86400000)+1;}
function shiftRangeText(s){
  const sd=(s.sdate||'').slice(5).replace('-','/'),ed=(s.edate||s.sdate||'').slice(5).replace('-','/');
  if((s.edate||s.sdate)===s.sdate)return `${s.stime||'—'}${s.etime?' - '+s.etime:''}`;
  return `${sd} ${s.stime} → ${ed} ${s.etime}`;
}
function cellObj(d,out){const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return {y,m,d:day,out,ds:y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0')};}
function monthMatrix(ym){
  const [y,m]=(ym||curYM()).split('-').map(Number);
  const first=new Date(y,m-1,1),startDow=first.getDay(),daysInMonth=new Date(y,m,0).getDate(),cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push(cellObj(new Date(y,m-1,1-i),true));
  for(let d=1;d<=daysInMonth;d++)cells.push(cellObj(new Date(y,m-1,d),false));
  while(cells.length%7!==0){const lst=cells[cells.length-1];cells.push(cellObj(new Date(lst.y,lst.m-1,lst.d+1),true));}
  return cells;
}
function shiftMonthStep(n){const [y,m]=curYM().split('-').map(Number);const d=new Date(y,m-1+n,1);shiftMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();}
function pageShift(){
  const cells=monthMatrix(),[y,m]=curYM().split('-').map(Number),todayStr=today();
  return `
  <div class="page-anim">
    <div class="row" style="margin:4px 2px 14px">
      <div class="h1 grow">📅 个人排班表</div>
      <button class="btn btn-grass btn-sm" style="padding:8px 14px" onclick="importShiftModal('${curYM()}')">📥 批量导入</button>
    </div>
    <div class="card">
      <div class="cal-head">
        <div class="nav"><button onclick="shiftMonthStep(-1)">‹</button></div>
        <div class="m">${y}年${m}月</div>
        <div class="nav"><button onclick="shiftMonthStep(1)">›</button></div>
      </div>
      <div class="cal-grid">
        ${WEEK.map(w=>`<div class="cal-wd">${w}</div>`).join('')}
        ${cells.map(c=>{const sh=shiftsForDate(c.ds);return `
          <div class="cal-cell ${c.out?'out':''} ${c.ds===todayStr?'today':''}" onclick="openDayShifts('${c.ds}')">
            <div class="d">${c.d}</div>
            <div class="tags">${sh.slice(0,3).map(s=>`<div class="sd" style="background:${shiftColor(s.type)}" title="${esc(s.type)}"></div>`).join('')}${sh.length>3?`<div class="sub" style="font-size:calc(9px * var(--fs));text-align:center;margin-top:2px">+${sh.length-3}</div>`:''}</div>
          </div>`;}).join('')}
      </div>
      <div class="cal-legend">
        ${SHIFT_TYPES.map(t=>`<span class="lg"><i class="dot" style="background:${t.color}"></i>${t.key}</span>`).join('')}
      </div>
    </div>
    <div class="sub" style="text-align:center;padding:6px 0 10px">点击任意日期查看 / 添加班次 · 顶部「批量导入」可粘贴文字或手动输入整月排班</div>
  </div>`;
}
function openDayShifts(ds){
  const sh=shiftsForDate(ds);
  openModal(`<h3>${ds} <button class="x" onclick="closeModal()">✕</button></h3>
    <div class="shift-list">
      ${sh.length?sh.map(s=>`
        <div class="task">
          <div class="ckbox" style="background:${shiftColor(s.type)}"></div>
          <div class="grow" onclick="openShiftModal('${ds}','${s.id}')">
            <div class="t-title">${esc(s.type)}</div>
            <div class="t-meta"><span class="chip aqua">${esc(shiftRangeText(s))}</span>${s.edate&&s.edate!==s.sdate?`<span class="chip">跨${daySpan(s)}天</span>`:''}${s.note?`<span class="chip">${esc(s.note)}</span>`:''}${s.img?'<span class="chip">🖼</span>':''}</div>
          </div>
          <button class="btn-sm" style="color:#e0908b" onclick="delShift('${s.id}','${ds}')">删除</button>
        </div>`).join(''):`<div class="empty">当天还没有排班</div>`}
    </div>
    <div class="grid2 mt8">
      <button class="btn btn-grass" onclick="openShiftModal('${ds}')">＋ 添加班次</button>
      <button class="btn btn-coral" onclick="importShiftModal('${ds}')">📥 批量导入</button>
    </div>`);
}
function openShiftModal(ds,id){
  const e=id?S.shifts.find(x=>x.id===id):null,sel=e?e.type:'早班';
  const sdt=(e&&e.sdate)?(e.sdate+'T'+(e.stime||'00:00')):'';
  const edt=(e&&e.edate)?(e.edate+'T'+(e.etime||'00:00')):'';
  openModal(`<h3>${e?'编辑班次':'添加班次'} <button class="x" onclick="closeModal()">✕</button></h3>
    <div class="f-label">班次类型</div>
    <div class="chips-row" id="shTypes">
      ${SHIFT_TYPES.map(t=>`<span class="chip-st ${t.key===sel?'on':''}" style="${t.key===sel?`background:${t.color}`:''}" onclick="pickShiftType('${t.key}')">${t.key}</span>`).join('')}
    </div>
    <div class="f-label" style="margin:12px 0 2px">开始（日期 + 时间）</div>
    <input id="shStart" type="datetime-local" value="${sdt}">
    <div class="f-label" style="margin:12px 0 2px">结束（日期 + 时间）</div>
    <input id="shEnd" type="datetime-local" value="${edt}">
    <div class="sub" style="margin-top:6px">结束留空 = 当天班次；也可跨天，如 2026-07-20 20:00 至 2026-07-22 08:00。</div>
    <div class="f-label" style="margin-top:12px">备注</div>
    <input id="shNote" value="${e?esc(e.note):''}" placeholder="例如：3号车间 / 带新人">
    <div class="f-label" style="margin-top:10px">凭证图片（可选）</div>
    <input id="shImg" type="file" accept="image/*" onchange="shPreview(this)">
    <div id="shPrev">${e&&e.img?`<img src="${e.img}" class="img-prev">`:''}</div>
    <button class="btn btn-coral btn-block mt16" onclick="saveShift('${id||''}')">${e?'保存修改':'添加班次'}</button>`);
  window._shType=sel;window._shImg=e?e.img:'';
}
function pickShiftType(k){window._shType=k;document.querySelectorAll('#shTypes .chip-st').forEach(el=>{const on=el.textContent===k;el.classList.toggle('on',on);el.style.background=on?shiftColor(k):'';});}
function shPreview(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#shPrev').innerHTML=`<img src="${r.result}" class="img-prev">`;window._shImg=r.result;};r.readAsDataURL(f);}
function saveShift(id){
  const sv=$('#shStart').value;if(!sv){toast('请填写开始日期和时间');return;}
  const [sdate,stime]=sv.split('T');
  const ev=$('#shEnd').value;
  let edate=sdate,etime='';
  if(ev){const p=ev.split('T');edate=p[0]||sdate;etime=p[1]||'';}
  if(edate<sdate){edate=sdate;etime='';}
  const rec={sdate,stime,edate,etime,type:window._shType||'早班',note:$('#shNote').value.trim(),img:window._shImg||'',date:sdate,start:stime,end:etime};
  if(id){const i=S.shifts.findIndex(x=>x.id===id);if(i>=0)S.shifts[i]=Object.assign(S.shifts[i],rec);}else S.shifts.push(Object.assign({id:uid()},rec));
  window._shImg='';closeModal();commit();toast(id?'班次已更新':'班次已添加');
}
function delShift(id,ds){S.shifts=S.shifts.filter(x=>x.id!==id);commit();openDayShifts(ds);}
/* 批量导入（文本解析 + 可选图片附件） */
function importShiftModal(scope){
  openModal(`<h3>📥 批量导入排班 <button class="x" onclick="closeModal()">✕</button></h3>
    <p class="sub">粘贴识别文字或手动输入，每行一条，如：7/1 早班 09:00-18:00。也可附一张排班截图作为凭证。</p>
    <div class="f-label">识别文本 / 手动输入</div>
    <textarea id="shImpText" placeholder="7/1 早班 09:00-18:00&#10;7/2 晚班 14:00-22:00&#10;7/3 休息"></textarea>
    <div class="f-label mt8">排班截图（可选，作为凭证）</div>
    <input id="shImpImg" type="file" accept="image/*" onchange="shImportPreview(this)">
    <div id="shImpPrev">${window._shImpImg?`<img src="${window._shImpImg}" class="img-prev">`:''}</div>
    <div class="grid2 mt12">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-coral" onclick="importShiftParse('${scope}')">解析并导入</button>
    </div>`);
}
function shImportPreview(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#shImpPrev').innerHTML=`<img src="${r.result}" class="img-prev">`;window._shImpImg=r.result;};r.readAsDataURL(f);}
function importShiftParse(scope){
  const prefix=scope.slice(0,7),txt=$('#shImpText').value.trim(),img=window._shImpImg||'';
  applyShiftImport(parseShiftText(txt,prefix),prefix,img);
}
function parseShiftText(txt,monthPrefix){
  if(!txt)return [];
  const [y,m]=monthPrefix.split('-').map(Number);let yy=y,out=[];
  const RE_FULL=/(\d{4})\s*[年\/\-\.]\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?\s*(?:至|到|～|~)\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?/;
  const RE_SHORT=/(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?\s*(?:至|到|～|~)\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})\s*[日]?\s*(?:晚|早|中午|下午|凌晨|早上|晚间)?\s*(\d{1,2}):?(\d{2})?/;
  const mkT=(h,mi)=>h?String(h).padStart(2,'0')+':'+(mi||'00'):'';
  const cleanNote=raw=>raw
    .replace(/(\d{1,2}):(\d{2})\s*[-~–至到]\s*(\d{1,2}):(\d{2})/g,'')
    .replace(/(\d{1,2}):(\d{2})/g,'')
    .replace(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/g,'')
    .replace(/(\d{1,2})[-/.月](\d{1,2})/g,'')
    .replace(/[年月日]/g,'')
    .replace(/早班|午班|晚班|夜班|休息|培训|会议|值班|班/g,'')
    .replace(/[-~–至到:]/g,' ')
    .replace(/\s+/g,' ').trim();
  const pushRange=(sy,sm,sd,st,em,ed,et,raw)=>{
    const sdate=sy+'-'+String(sm).padStart(2,'0')+'-'+String(sd).padStart(2,'0');
    const edate=sy+'-'+String(em).padStart(2,'0')+'-'+String(ed).padStart(2,'0');
    let type='早班';for(const t of SHIFT_TYPES){if(raw.includes(t.key)){type=t.key;break;}}
    const note=cleanNote(raw.replace(RE_FULL,'').replace(RE_SHORT,''));
    out.push({date:sdate,sdate,stime:st,edate,etime:et,type,note,img:''});
  };
  txt.split(/\n|；|;|\|/).forEach(line=>{
    line=line.trim();if(!line)return;
    let m=line.match(RE_FULL);
    if(m){pushRange(+m[1],+m[2],+m[3],mkT(m[4],m[5]),+m[6],+m[7],mkT(m[8],m[9]),line);return;}
    m=line.match(RE_SHORT);
    if(m){pushRange(yy,+m[1],+m[2],mkT(m[3],m[4]),+m[5],+m[6],mkT(m[7],m[8]),line);return;}
    let mm,dd=null,full=line.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
    if(full){yy=+full[1];mm=+full[2];dd=+full[3];}
    else{const p=line.match(/(\d{1,2})[-/.月](\d{1,2})/);if(p){mm=+p[1];dd=+p[2];}}
    if(!dd)return;
    const date=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    let type='早班';for(const t of SHIFT_TYPES){if(line.includes(t.key)){type=t.key;break;}}
    let start='',end='';const tm=line.match(/(\d{1,2}):?(\d{2})?\s*[-~–至到]\s*(\d{1,2}):?(\d{2})?/);
    if(tm){start=String(tm[1]).padStart(2,'0')+':'+(tm[2]||'00');end=String(tm[3]).padStart(2,'0')+':'+(tm[4]||'00');}
    else{const t2=line.match(/(\d{1,2}):(\d{2})/);if(t2)start=t2[1].padStart(2,'0')+':'+t2[2];}
    let note=cleanNote(line);
    out.push({date,type,start,end,note,img:'',sdate:date,stime:start,edate:date,etime:end});
  });
  return out;
}
function applyShiftImport(arr,monthPrefix,img){
  arr=(arr||[]).filter(x=>x&&x.sdate).map(x=>({id:uid(),sdate:String(x.sdate).slice(0,10),stime:x.stime||'',edate:String(x.edate||x.sdate).slice(0,10),etime:x.etime||'',type:SHIFT_TYPES.find(t=>t.key===x.type)?x.type:'早班',note:x.note||'',img:img||'',date:String(x.sdate).slice(0,10),start:x.stime||'',end:x.etime||''}));
  if(!arr.length){toast('没有解析到排班，换种写法试试？');return;}
  S.shifts.push(...arr);window._shImpImg='';closeModal();commit();toast('已导入 '+arr.length+' 条排班');
}

/* ================= 账单导入（微信/支付宝 CSV） ================= */
function importBillModal(){
  openModal(`<h3>📥 导入账单 <button class="x" onclick="closeModal()">✕</button></h3>
    <p class="sub">支持微信支付、支付宝导出的账单（CSV）。可粘贴文本或上传文件，自动识别来源与收/支方向，并按交易单号去重。</p>
    <div class="f-label">来源（识别不准时可手动指定）</div>
    <div class="seg" id="billSrc">
      <button class="on" onclick="pickBillSrc('auto')">自动</button>
      <button onclick="pickBillSrc('wx')">微信支付</button>
      <button onclick="pickBillSrc('ali')">支付宝</button>
    </div>
    <div class="f-label mt12">支出归入账户</div>
    <div class="seg" id="billAcct">
      <button class="on" onclick="pickBillAcct('daily')">🧾 日常支出</button>
      <button onclick="pickBillAcct('mood')">✨ 心情</button>
    </div>
    <div class="f-label mt12">账单内容（粘贴 CSV 文本，或从微信/支付宝导出后上传）</div>
    <textarea id="billText" placeholder="粘贴微信/支付宝账单 CSV 内容，或下方选择文件…"></textarea>
    <div class="f-label mt8">上传 CSV / TXT 文件</div>
    <input id="billFile" type="file" accept=".csv,.txt,text/csv,text/plain">
    <button class="btn btn-ghost btn-block mt12" onclick="previewBills()">解析预览</button>
    <div id="billPreview"></div>`);
  window._billSrc='auto';window._billAcct='daily';window._billItems=null;
}
function pickBillSrc(s){window._billSrc=s;segOn('billSrc',s==='auto'?'自动':(s==='wx'?'微信支付':'支付宝'),['自动','微信支付','支付宝']);}
function pickBillAcct(a){window._billAcct=a;segOn('billAcct',a==='daily'?'🧾 日常支出':'✨ 心情',['🧾 日常支出','✨ 心情']);}
function segOn(id,label,labels){const box=$('#'+id);if(!box)return;[...box.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',labels[i]===label));}
function previewBills(){
  const file=$('#billFile').files[0];
  if(file){decodeBillFile(file).then(t=>{$('#billText').value=t;_doPreview($('#billText').value);}).catch(()=>toast('读取文件失败'));return;}
  const txt=$('#billText').value.trim();
  if(!txt){toast('请粘贴文本或选择文件');return;}
  _doPreview(txt);
}
function decodeBillFile(file){
  return file.arrayBuffer().then(buf=>{
    const u8=new Uint8Array(buf);
    if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF)return new TextDecoder('utf-8').decode(buf);
    let s=new TextDecoder('utf-8',{fatal:false}).decode(buf);
    if(/�/.test(s))s=new TextDecoder('gbk',{fatal:false}).decode(buf);
    return s;
  });
}
function _doPreview(txt){
  const r=parseBillText(txt,window._billSrc||'auto');
  window._billItems=r.items;
  const box=$('#billPreview');
  if(!r.items.length){box.innerHTML=`<div class="empty">未解析到账单记录，请确认是微信/支付宝导出的 CSV，或手动指定来源</div>`;return;}
  const existExt=new Set();
  S.expenses.forEach(e=>{if(e.extId)existExt.add(e.extId);});
  S.incomes.forEach(i=>{if(i.extId)existExt.add(i.extId);});
  let html=`<div class="sub mt12">识别为 <b>${esc(r.source)}</b> · 共 ${r.items.length} 条（支出 ${r.expN} / 收入 ${r.incN}）· 取消勾选可跳过某条</div>`;
  html+=r.items.map((it,idx)=>{
    const dup=it.extId&&existExt.has(it.extId);
    return `<label class="bill-imp${dup?' dup':''}">
      <input type="checkbox" data-i="${idx}" ${dup?'':'checked'} ${dup?'disabled':''}>
      <span class="bi-dir ${it.dir==='income'?'in':'out'}">${it.dir==='income'?'收':'支'}</span>
      <span class="bi-main"><b>${esc(it.name||'—')}</b><div class="sub">${esc(it.date)} · ${esc(it.cat)}</div></span>
      <span class="bi-amt ${it.dir==='income'?'amt-in':'amt-out'}">${it.dir==='income'?'+':'-'}${fmt(it.amt)}</span>
      ${dup?'<span class="sub">已存在</span>':''}
    </label>`;
  }).join('');
  html+=`<div class="grid2 mt12"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-coral" onclick="doImportBills()">导入选中</button></div>`;
  box.innerHTML=html;
}
function doImportBills(){
  const items=window._billItems;if(!items||!items.length){toast('没有可导入的项');return;}
  const acct=window._billAcct||'daily';
  const checks=document.querySelectorAll('#billPreview input[type=checkbox]:checked');
  const want=new Set([...checks].map(c=>+c.dataset.i));
  const existExt=new Set();
  S.expenses.forEach(e=>{if(e.extId)existExt.add(e.extId);});
  S.incomes.forEach(i=>{if(i.extId)existExt.add(i.extId);});
  let nAdd=0;
  items.forEach((it,idx)=>{
    if(!want.has(idx))return;
    if(it.extId&&existExt.has(it.extId))return;
    const note=(it.name+' '+(it.note||'')).trim();
    if(it.dir==='income'){
      S.incomes.push({id:uid(),ts:Date.now(),date:it.date,total:it.amt,alloc:{save:0,daily:it.amt,mood:0},category:it.cat,note,img:'',extId:it.extId||''});
    }else{
      S.expenses.push({id:uid(),ts:Date.now(),date:it.date,amount:it.amt,account:acct,category:it.cat,note,img:'',extId:it.extId||''});
    }
    if(it.extId)existExt.add(it.extId);
    nAdd++;
  });
  if(!nAdd){toast('没有新增（可能都已导入过）');return;}
  closeModal();commit();toast('已导入 '+nAdd+' 条账单');
}
function parseCSVLine(line){
  const out=[];let cur='';let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else{
      if(c===','){out.push(cur);cur='';}
      else if(c==='"'){q=true;}
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}
function cleanDate(s){
  s=(s||'').trim().replace(/\//g,'-');
  const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0'):'';
}
function cleanAmt(s){const n=parseFloat(String(s||'').replace(/[¥￥,\s]/g,''));return isNaN(n)?0:n;}
function guessCat(name,isIncome){
  const n=String(name||'');
  if(isIncome){
    if(/红包|奖励/.test(n))return '红包';
    if(/工资|薪酬|薪资|公积金|个税/.test(n))return '工资';
    if(/理财|基金|股票|利息|收益|分红/.test(n))return '理财';
    if(/兼职|外包|稿费|劳务/.test(n))return '兼职';
    return '其他';
  }

    ['购物',['购物','淘宝','天猫','京东','拼多多','超市','便利店','商城','服饰','鞋','包','网购']],
    ['居家',['居家','物业','水电','房租','家居','日用','日用百货']],
    ['医疗',['医疗','医院','诊所','体检','保险','药','健']]];
  for(const [cat,kws] of map)if(kws.some(k=>n.includes(k)))return cat;
  return '其他';
}
function parseBillText(txt,src){
  const raw=txt.split(/\r?\n/).map(l=>l.replace(/^﻿/,''));
  const lines=raw.map(l=>l.trim()).filter(Boolean);
  let hi=-1,source='未知';
  const wxH=lines.findIndex(l=>/交易时间/.test(l)&&/收\/支/.test(l));
  const aliH=lines.findIndex(l=>/(交易创建时间|交易号)/.test(l)&&/收\/支|金额/.test(l));
  if((src==='ali')||(src!=='wx'&&aliH>=0)){hi=aliH;source='支付宝';}
  else if((src==='wx')||wxH>=0){hi=wxH;source='微信支付';}
  if(hi<0)return parseBillPlain(lines);
  const cols=parseCSVLine(lines[hi]);
  const idx=re=>{for(let i=0;i<cols.length;i++)if(re.test(cols[i]))return i;return -1;};
  const timeI=idx(/交易时间|付款时间|创建时间/);
  const dirI=idx(/收\/支/);
  const amtI=idx(/金额/);
  const nameI=(()=>{let n=idx(/交易对方/);if(n<0)n=idx(/商品名称/);if(n<0)n=idx(/商品/);return n;})();
  const noteI=idx(/备注/);
  const tidI=Math.max(idx(/交易单号/),idx(/交易号/),idx(/商家订单号/));
  const items=[];let expN=0,incN=0;
  for(let i=hi+1;i<lines.length;i++){
    const ln=lines[i];
    if(/^[-=]+$/.test(ln)||/共\s*\d|记录数|笔.*交易|导出时间|申请时间|记账时间/.test(ln))continue;
    const c=parseCSVLine(ln);
    if(c.length<3)continue;
    const ds=cleanDate(timeI>=0?c[timeI]:c[0]);
    const dirRaw=dirI>=0?c[dirI]:'';
    let dir=null;
    if(/支出/.test(dirRaw))dir='expense';
    else if(/收入/.test(dirRaw))dir='income';
    else continue;
    const amt=cleanAmt(amtI>=0?c[amtI]:c[c.length-1]);
    if(!(amt>0)||!ds)continue;
    const name=(nameI>=0?c[nameI]:c[2]||'').trim()||'账单导入';
    const note=(noteI>=0?c[noteI]:'').trim();
    const extId=(tidI>=0?c[tidI]:'').trim();
    const cat=guessCat(name,dir==='income');
    items.push({dir,date:ds,amt,name,note,extId,cat});
    dir==='income'?incN++:expN++;
  }
  return {items,source,expN,incN};
}
function parseBillPlain(lines){
  const items=[];let expN=0,incN=0;
  lines.forEach(ln=>{
    const ds=cleanDate(ln);if(!ds)return;
    let dir=null;
    if(/支出|转出|付款|消费|支/.test(ln))dir='expense';
    else if(/收入|转入|收款|入账|红包|收/.test(ln))dir='income';
    const m=ln.match(/[¥￥]?\s*(\d[\d,]*\.?\d*)/);
    const amt=cleanAmt(m?m[1]:'');
    if(!dir||!(amt>0))return;
    const name=(ln.replace(/[¥￥]/g,'').replace(/\d[\d,\.]*\d?/g,'').replace(/支出|收入|转入|转出|付款|收款|消费|入账|红包|支|收/g,'').replace(/\s+/g,'')).slice(0,20)||'账单';
    items.push({dir,date:ds,amt,name,note:'',extId:'',cat:guessCat(name,dir==='income')});
    dir==='income'?incN++:expN++;
  });
  return {items,source:'文本',expN,incN};
}

  if(window._almType==='countdown'){const m=Math.max(1,Number($('#almMins')?$('#almMins').value:25)||25);alarm={type:'countdown',mins:m,deadline:Date.now()+m*60000,on:true};}
  else if(window._almType==='scheduled'){const v=$('#almAt')?$('#almAt').value:'';if(v)alarm={type:'scheduled',at:v,on:true};}

function aiReply(q){
  const b=balances(),f=todayFlow(),g=giftStat('month');
  const tasks=todayTasks(),done=tasks.filter(t=>isDone(t.id)).length;
  if(/复盘/.test(q)){
    return `🤖 今日复盘（${today()}）\n✅ 任务：完成 ${done}/${tasks.length} 项${tasks.length&&done===tasks.length?'，全部达成，太棒了！':tasks.length?'，还有 '+(tasks.length-done)+' 项待完成，加油！':''}\n💰 收支：收入 +${fmt(f.inc)}，支出 -${fmt(f.exp)}（心情消费 ${fmt(f.moodExp)}）\n📝 速记：今天记录了 ${S.notes.filter(n=>n.date===today()).length} 条\n建议：睡前给未完成任务定个明日时段。`;
  }
  if(/学习计划|任务计划/.test(q)){
    const rep=S.tasks.filter(t=>t.type==='repeat'&&!t.endedDate);
    return `🤖 任务计划建议\n当前有 ${rep.length} 个循环任务在跑：\n${rep.slice(0,5).map(t=>'· '+t.title+'（'+repeatLabel(t)+'）').join('\n')||'· 暂无，建议先建立1-2个每日循环任务'}\n建议节奏：早上安排最难任务，晚上做轻量复习，每天完成后写打卡心得沉淀。`;
  }
  if(/消费分析/.test(q)){
    const month=today().slice(0,7);
    const mExp=S.expenses.filter(e=>(e.date||'').slice(0,7)===month);
    const mDaily=mExp.filter(e=>e.account==='daily').reduce((s,e)=>s+Number(e.amount),0);

function weightBarsHTML(){
  // 按日期聚合（每天取最新一次），再按日期升序排列（左旧 → 右新）
  const map={};
  S.weights.forEach(function(w){ if(!map[w.date]||w.ts>(map[w.date].ts||0)) map[w.date]={value:w.value,ts:w.ts}; });
  const dates=Object.keys(map).sort();
  if(dates.length<2)return '<div class="sub" style="text-align:center;margin-top:6px">记录 2 天以上体重即可查看趋势曲线</div>';
  const pts=dates.map(function(d){return {d:d,v:map[d].value};});
  const vals=pts.map(function(p){return p.v;});
  let vmin=Math.min.apply(null,vals), vmax=Math.max.apply(null,vals);
  const pad=(vmax-vmin)*0.18||1; vmin-=pad; vmax+=pad;
  if(vmax<=vmin){vmin-=1;vmax+=1;}
  const W=320,H=174,padL=30,padR=12,padT=16,padB=26;
  const pw=W-padL-padR, ph=H-padT-padB, n=pts.length;
  function X(i){return padL+(n===1?pw/2:pw*i/(n-1));}
  function Y(v){return padT+ph*(vmax-v)/(vmax-vmin);}
  const P=pts.map(function(p,i){return {x:X(i),y:Y(p.v)};});
  let dpath='M'+P[0].x.toFixed(1)+' '+P[0].y.toFixed(1);
  for(let i=0;i<n-1;i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    dpath+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2.x.toFixed(1)+' '+p2.y.toFixed(1);
  }
  const baseY=(padT+ph).toFixed(1);
  const area=dpath+' L'+P[n-1].x.toFixed(1)+' '+baseY+' L'+P[0].x.toFixed(1)+' '+baseY+' Z';
  let grid='';
  for(let k=0;k<=2;k++){ const v=vmax-(vmax-vmin)*k/2; const y=Y(v); grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#ece5e2" stroke-width="1"/><text x="'+(padL-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#a99e99">'+Math.round(v)+'</text>'; }
  let dots='';
  pts.forEach(function(p,i){ const x=X(i),y=Y(p.v); dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="#3aa79f" stroke="#fff" stroke-width="1.5"/>'; if(n<=8) dots+='<text x="'+x.toFixed(1)+'" y="'+(y-7).toFixed(1)+'" text-anchor="middle" font-size="9" fill="#4f807c">'+p.v+'</text>'; });
  let xlab='';
  pts.forEach(function(p,i){ const x=X(i); xlab+='<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8.5" fill="#a99e99">'+String(p.d).slice(5)+'</text>'; });
  const tw=Number(S.dietGoal.targetWeight)||0;
  let target='';
  if(tw&&tw>=vmin&&tw<=vmax){ const ty=Y(tw).toFixed(1); target='<line x1="'+padL+'" y1="'+ty+'" x2="'+(W-padR)+'" y2="'+ty+'" stroke="#e0908b" stroke-width="1" stroke-dasharray="4 3"/><text x="'+(W-padR)+'" y="'+(Number(ty)-3).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#e0908b">目标 '+tw+'</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin-top:8px">'+grid+'<path d="'+area+'" fill="rgba(58,167,159,0.12)" stroke="none"/><path d="'+dpath+'" fill="none" stroke="#3aa79f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+target+dots+xlab+'</svg>';
}

    <div class="f-label">日期</div><input id="wDate" type="date" value="${today()}">
    <button class="btn btn-grass btn-block mt8" onclick="saveWeight()">保存体重</button>`);
}
function saveWeight(){
  const v=Number($('#wVal').value)||0;
  if(v<=0){toast('请填写体重');return;}
  S.weights.push({id:uid(),ts:Date.now(),date:$('#wDate').value||today(),value:v});
  closeModal();commit();toast('已记录体重 '+v+' kg');
}
function openDietGoalModal(){
  const g=S.dietGoal;
  openModal(`<h3>🎯 减肥目标 <button class="x" onclick="closeModal()">✕</button></h3>
    <div class="f-label">目标体重 (kg)</div><input id="gT" type="number" inputmode="decimal" value="${g.targetWeight||''}" placeholder="如 50">
    <div class="f-label">起始体重 (kg)</div><input id="gS" type="number" inputmode="decimal" value="${g.startWeight||''}" placeholder="如 60">
    <div class="f-label">身高 (cm)</div><input id="gH" type="number" inputmode="decimal" value="${g.height||''}" placeholder="如 165">
    <div class="f-label">每日建议摄入 (kcal)</div><input id="gC" type="number" inputmode="decimal" value="${g.targetKcal||''}" placeholder="如 1500">
    <p class="sub mt8">💡 用于计算 BMI、「已减」进度与每日摄入是否超标</p>
    <button class="btn btn-grass btn-block mt8" onclick="saveDietGoal()">保存目标</button>`);
}
function saveDietGoal(){
  S.dietGoal={targetWeight:Number($('#gT').value)||0,startWeight:Number($('#gS').value)||0,height:Number($('#gH').value)||0,targetKcal:Number($('#gC').value)||0};

applyTheme(curTheme());
window.addEventListener('resize',()=>{const f=$('#fab');if(!f)return;const w=f.offsetWidth||54,h=f.offsetHeight||54;const x=Math.max(4,Math.min(fabPos.x,window.innerWidth-w-4));const y=Math.max(4,Math.min(fabPos.y,window.innerHeight-h-4));f.style.left=x+'px';f.style.top=y+'px';fabPos.x=x;fabPos.y=y;updateFabMenuAnchor();});
/* 横屏布局：用 JS 检测旋转并切换 html.land 类，避免 iOS/部分浏览器不触发 orientation 媒体查询导致手机旋转后不进入横版 */
function applyLandscape(){
  const land=window.innerWidth>window.innerHeight && window.innerWidth>=480;
  document.documentElement.classList.toggle('land',land);
  const fm=$('#fabMenu');
  if(fm&&fm.classList.contains('show'))updateFabMenuAnchor();
}
window.addEventListener('resize',applyLandscape);
window.addEventListener('orientationchange',()=>setTimeout(applyLandscape,80));
applyLandscape();
applyFont();
/* 横屏导航可折叠 */
const _navT=document.createElement('button');
_navT.id='navToggle';
_navT.innerHTML='☰';
_navT.title='收起 / 展开侧栏';
_navT.onclick=()=>document.documentElement.classList.toggle('nav-collapsed');
document.body.appendChild(_navT);

/* 点击特效：随机狗爪印🐾 / 骨头🦴 / 小狗🐶 飘起淡出（爪印权重更高，1~3 个/次；拖拽/滚动/输入框不触发） */
(function(){
  const FX=['🐾','🐾','🐾','🐾','🦴','🐶','🐕']; // 爪印出现概率更高
  let sx=0,sy=0;
  document.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;},{passive:true});
  document.addEventListener('pointerup',e=>{
    if(e.target.closest('.fab,.float-win .fw-head,#navToggle'))return;
    if(e.target.closest('input,textarea,select'))return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.hypot(dx,dy)>10)return; // 拖拽或滚动，不触发
    const n=1+Math.floor(Math.random()*3); // 每次 1~3 个特效元素
    for(let i=0;i<n;i++){
      const el=document.createElement('div');
      el.className='paw-pop';
      el.textContent=FX[Math.floor(Math.random()*FX.length)];
      el.style.left=(e.clientX+(Math.random()*44-22))+'px';
      el.style.top=(e.clientY+(Math.random()*26-13))+'px';
      el.style.setProperty('--pw',(18+Math.random()*20).toFixed(0));      // 基础字号 18~38px
      el.style.setProperty('--pr',(Math.random()*56-28).toFixed(1)+'deg'); // 随机旋转
      el.style.setProperty('--pd',(Math.random()*64-32).toFixed(0)+'px');  // 随机横向漂移
      const dur=(620+Math.random()*280)|0;
      el.style.animationDuration=dur+'ms';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),dur+80);
    }
  },{passive:true});
})();

/* 已取消应用锁：直接启动应用；启动时从云端恢复数据 */
if(!S)S=load();
_booted=true;
fullBoot();

/* PWA：注册 Service Worker + 捕获安装提示 */
if('serviceWorker' in navigator){
  function swShowUpdate(){var b=document.getElementById('swUpdate');if(b)b.classList.add('show');}
  function swReg(){
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller){swShowUpdate();}
      reg.addEventListener('updatefound',function(){
        var n=reg.installing;
        n.addEventListener('statechange',function(){
          if(n.state==='installed' && navigator.serviceWorker.controller){swShowUpdate();}
        });
      });
    }).catch(function(){});
  }
  if(document.readyState==='complete')swReg();else window.addEventListener('load',swReg);
  navigator.serviceWorker.addEventListener('controllerchange',function(){location.reload();});
}
function swUpdateNow(){
  var b=document.getElementById('swUpdate');if(b)b.classList.remove('show');
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(reg&&reg.waiting){reg.waiting.postMessage('skip');}else{location.reload();}
  }).catch(function(){location.reload();});
}
function showSplash(){
  const sp=document.getElementById('splash');if(sp){sp.classList.remove('hidden-init');sp.classList.remove('hide');}
  const now=new Date();
  const wd=['日','一','二','三','四','五','六'][now.getDay()];
  $('#splashDate').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${wd}`;
  const hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0');
  $('#splashTime').textContent=`${hh}:${mm}`;
  $('#splashMsg').textContent=splashEncourage(now.getHours());
  const ic=$('#splashIc');if(ic)ic.innerHTML=appLogoHTML();
  setTimeout(()=>{const s=$('#splash');if(s)s.classList.add('hide');},2200);
}
function splashEncourage(h){
  if(h<6) return '夜深了，照顾好自己，早点休息 🌙';
  if(h<11) return ['早安，今天的你依然闪闪发光 ✨','新的一天，慢慢来，会很好的 🌿','早上好呀，喝杯温水再开工 💧'][h%3];
  if(h<14) return ['午间小憩一下，给自己充个电 ☀️','忙碌的间隙，记得好好吃饭 🍚','保持节奏，你做得很棒 🌸'][h%3];
  if(h<18) return ['下午也要稳稳的，加油 💪','累了就伸个懒腰，别硬撑 🌿','你比昨天又进步了一点点 🌟'][h%3];
  if(h<22) return ['傍晚好，今天辛苦啦 🌇','收个尾，奖励自己一下吧 🍰','今晚也别忘了好好吃饭 🍲'][h%3];
  return '夜色温柔，放下手机早点睡 🌙';
}
